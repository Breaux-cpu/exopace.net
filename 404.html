    <style>
      html, body { margin: 0; min-height: 100%; background: var(--exo-void); color: var(--exo-cyan); }

      .miss {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;

      }
      .miss b { color: var(--exo-amber); letter-spacing: 0.34em; font-size: 13px; margin-bottom: 16px; }
      .miss-jumps {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px; width: min(640px, 100%); margin-top: 28px; letter-spacing: 0.08em;
      }
      .miss-jumps a {
        display: flex; align-items: center; justify-content: center; min-height: 44px;
        padding: 12px 14px; border: 1px solid var(--exo-line); border-radius: 12px;
        color: var(--exo-text); background: rgba(3, 6, 11, 0.72); text-decoration: none;
        font-family: var(--exo-sans); font-size: var(--exo-text-sm);
      }
      .miss-jumps a:focus-visible { outline: 2px solid var(--exo-amber); outline-offset: 2px; }
