<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03060b" />
    <meta name="color-scheme" content="dark" />
    <title>EXOpace — Cameras maintenance</title>
    <meta name="description" content="The EXOpace camera catalogue is offline for maintenance." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://exopace.net/maintenance/" />
    <style>
      html, body {
        margin: 0; min-height: 100%; background: #03060b; color: #d7e4ea;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      main {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding: 32px 20px 48px; box-sizing: border-box;
      }
      p { max-width: 34rem; margin: 0; line-height: 1.55; }
      .brand {
        color: #ffe08a; letter-spacing: 0.34em; font-size: 13px;
        margin: 0 0 18px;
      }
      h1 {
        margin: 0 0 14px; color: #7ee0ff; font-size: 12px; font-weight: 400;
        letter-spacing: 0.22em;
      }
      .when { color: #ffe08a; margin-top: 14px; letter-spacing: 0.08em; font-size: 12px; }
      nav { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      a {
        color: #7ee0ff; text-decoration: none; letter-spacing: 0.14em; font-size: 11px;
        border: 1px solid #1c2a33; border-radius: 4px; padding: 12px 16px; min-height: 44px;
        display: inline-flex; align-items: center;
      }
      a:hover, a:focus-visible { color: #ffe08a; border-color: #3a4d5a; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">EXOPACE</p>
      <h1>CAMERAS · MAINTENANCE</h1>
      <p>The camera catalogue is offline for maintenance. Mission Control, Radio, and Mesh stay available.</p>
      <p class="when">Scheduled to return 10 November 2026.</p>
      <nav aria-label="EXOpace surfaces">
        <a href="/mission/">MISSION CONTROL</a>
        <a href="/radio/">RADIO</a>
        <a href="/mesh/">MESH</a>
      </nav>
    </main>
  </body>
</html>
