    <style>
      html, body, #root { margin: 0; height: 100%; background: #03060b; overflow: hidden; }
      #boot-void {
        position: fixed; inset: 0; z-index: 200;
        background: #03060b; color: #7ee0ff;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        letter-spacing: 0.28em; font-size: 11px;
        transition: opacity 0.9s ease;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #boot-void svg { width: 72px; height: 72px; margin-bottom: 18px; }
      #boot-void b { color: #ffe08a; font-weight: 600; letter-spacing: 0.34em; font-size: 13px; margin-bottom: 14px; }
      /* Eat taps through the fade. .out used to set pointer-events:none and
         LAYERS-region hits landed on <a href="/radio/">. Hide after transition. */
      #boot-void.out { opacity: 0; }
      /* HUD paints under the splash (Cesium 20s+). RADIO can wrap into the
         LAYERS region before moc-phone.css applies. Freeze the tree. */
      html.exo-booting #root,
      html.exo-booting #exo-install,
      html.exo-booting a.radio-link,
      html.exo-booting a[href*="/radio"] {
        pointer-events: none !important;
      }
      #exo-install {
        position: fixed; z-index: 70; right: 14px;
        bottom: calc(148px + env(safe-area-inset-bottom));
        background: #070c12cc; border: 1px solid #1c2a33; color: #ffe08a;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10px; letter-spacing: 0.12em; padding: 7px 9px; border-radius: 4px;
        min-height: 44px; cursor: pointer;
      }
      #exo-install[hidden] { display: none; }
      /* SAT-CAM / ARM refusal toasts live outside #root so React UTC
         ticks cannot wipe them. Match bundle .toast. */
      #exo-toast {
        position: fixed; left: 50%; top: 56px; transform: translate(-50%, 0);
        background: #ffe08a; color: #141406;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
        padding: 7px 12px; border-radius: 4px; z-index: 80;
        pointer-events: none;
      }
      #exo-toast[hidden] { display: none; }
    </style>

  <body>
    <!-- Outside #root: React createRoot wipes #root and used to kill first-paint. -->
    <div id="boot-void">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
        <ellipse cx="64" cy="64" rx="38" ry="14" fill="none" stroke="#7ee0ff" stroke-width="2"/>
        <circle cx="64" cy="64" r="6" fill="#ffe08a"/>
        <circle cx="98" cy="58" r="3" fill="#7ee0ff"/>
      </svg>
      <b>EXOpace</b>CHECKING PIPELINE…
    </div>
    <button id="exo-install" type="button" hidden>INSTALL APP</button>
    <div id="exo-toast" class="toast" hidden></div>
    <div id="root" inert></div>
    <!-- Runtime config first (window.EXOPACE_*), then the prebuilt Cesium bundle
         (served from /cesium/, NOT bundled by Vite), then the app. -->
    <script>window.CESIUM_BASE_URL = "/cesium/";</script>
    <script src="/env.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script type="module" crossorigin src="/assets/index-B5yAHF7-.js?v=52"></script>
    <script src="/pwa-install.js" defer></script>
    <script>
      (function () {
        var v = document.getElementById("boot-void");
        var root = document.getElementById("root");
        if (!v) return;
        document.documentElement.classList.add("exo-booting");
        if (root) root.setAttribute("inert", "");
        function booting() {
          return document.documentElement.classList.contains("exo-booting");
        }
        function eat(e) {
          if (!booting()) return;
          e.preventDefault();
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        ["click", "auxclick", "pointerdown", "pointerup", "touchstart", "touchend", "mousedown", "mouseup"].forEach(function (type) {
          document.addEventListener(type, eat, true);
        });
        document.addEventListener("keydown", function (e) {
          if (!booting()) return;
          if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") eat(e);
        }, true);
        function hide() {
          v.style.display = "none";
          v.style.pointerEvents = "none";
          document.documentElement.classList.remove("exo-booting");
          if (root) root.removeAttribute("inert");
        }
        v.addEventListener("transitionend", function (e) {
          if (e.propertyName === "opacity" && v.classList.contains("out")) hide();
        });
      })();
      (function () {
        document.addEventListener("keydown", function (e) {
          if (e.key !== "/") return;
          var t = e.target && e.target.tagName;
          if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
          if (!window.matchMedia || !window.matchMedia("(max-width: 820px)").matches) return;
          e.preventDefault();
          e.stopImmediatePropagation();
        }, true);
      })();
      (function () {
        /* Overlay leftovers the hashed bundle cannot gate:
           SAT-CAM latches cam:"satcam" / .on with no lock (FOLLOW already
           toasts NO LOCK). STATION ARM sets PASS_ARMED with no radio/rotator. */
        var toastTimer = null;
        function showHudToast(msg) {
          var t = document.getElementById("exo-toast");
          if (!t) return;
          t.textContent = msg;
          t.hidden = false;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            t.hidden = true;
            t.textContent = "";
          }, 1800);
        }
        function locked() {
          return !!document.querySelector(".dossier button");
        }
        function satCamBtn(el) {
          if (!el || !el.closest) return null;
          var btn = el.closest(".camstrip .btn");
          if (!btn) return null;
          return (btn.textContent || "").replace(/\s+/g, " ").trim() === "SAT-CAM" ? btn : null;
        }
        function armBtn(el) {
          if (!el || !el.closest) return null;
          var btn = el.closest(".station .btn");
          if (!btn) return null;
          var t = (btn.textContent || "").replace(/\s+/g, " ").trim();
          return t.indexOf("ARM ") === 0 ? btn : null;
        }
        function chainOk(label) {
          var bs = document.querySelectorAll(".station .kv b");
          for (var i = 0; i < bs.length; i++) {
            if ((bs[i].textContent || "").trim() !== label) continue;
            var span = bs[i].nextElementSibling;
            return !!(span && span.classList && span.classList.contains("stok"));
          }
          return false;
        }
        function rfReady() {
          return chainOk("RADIO") && chainOk("ROTATOR");
        }
        function refuse(e) {
          var cam = satCamBtn(e.target);
          if (cam && !locked()) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            cam.classList.remove("on");
            showHudToast("NO LOCK");
            return;
          }
          var arm = armBtn(e.target);
          if (arm && !rfReady()) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            showHudToast("RF CHAIN OFFLINE");
          }
        }
        document.addEventListener("click", refuse, true);
      })();
    </script>
  </body>
