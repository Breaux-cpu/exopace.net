<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03060b" />
    <meta name="color-scheme" content="dark" />
    <title>EXOpace — Mission Control</title>
    <link rel="canonical" href="https://exopace.net/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #03060b; overflow: hidden; }
      #boot-void {
        position: fixed; inset: 0; z-index: 80; background: #03060b; color: #7ee0ff;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        letter-spacing: 0.28em; font-size: 11px; transition: opacity 0.9s ease;
      }
      #boot-void b { color: #ffe08a; font-weight: 600; letter-spacing: 0.34em; font-size: 13px; margin-bottom: 14px; }
      #boot-void.out { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot-void"><b>EXOpace</b>BRINGING EARTH ONLINE…</div>
    <canvas id="globe"></canvas>
    <div class="hud" id="hud"></div>
    <script src="/three.min.js"></script>
    <script src="/satellite.min.js"></script>
    <script src="/protocol.js"></script>
    <script src="/engine.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
