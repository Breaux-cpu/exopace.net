<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EXOpace — Cameras</title>
  <meta name="theme-color" content="#03060b" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #03060b; color: #d7e7ea; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    body { display: flex; flex-direction: column; min-height: 100%; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      padding: 10px 14px; border-bottom: 1px solid rgba(126, 224, 255, 0.25);
      background: #03060b;
    }
    .brand { color: #7ee0ff; letter-spacing: 0.18em; text-decoration: none; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav a, button.locate {
      color: #ffe08a; text-decoration: none; border: 1px solid rgba(255, 224, 138, 0.45);
      min-height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center;
      background: transparent; font: inherit; letter-spacing: 0.08em;
    }
    nav a[aria-current="page"] { color: #7ee0ff; border-color: rgba(126, 224, 255, 0.7); }
    #count { margin-left: auto; color: #7ee0ff; font-size: 12px; }
    #map { flex: 1; min-height: 0; background: #071018; }
    .leaflet-container { background: #071018; font-family: inherit; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #03060b; color: #d7e7ea; border: 1px solid rgba(126, 224, 255, 0.35); }
    .leaflet-popup-content { margin: 10px 12px; }
    .leaflet-popup-content img { display: block; max-width: 240px; margin-top: 8px; }
    .leaflet-bar a { min-width: 44px; min-height: 44px; line-height: 44px; background: #03060b; color: #7ee0ff; border-bottom-color: rgba(126, 224, 255, 0.35); }
    @media (max-width: 720px) {
      #count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/mission/">EXOPACE</a>
    <nav>
      <a href="/mission/">MISSION</a>
      <a href="/radio/">RADIO</a>
      <a href="/mesh/">MESH</a>
      <a href="/cameras/" aria-current="page">CAMERAS</a>
      <button class="locate" type="button" id="locate">LOCATE</button>
    </nav>
    <div id="count">LOADING</div>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const countEl = document.getElementById("count");
    const map = L.map("map", { zoomControl: true, worldCopyJump: true }).setView([39.5, -98.3], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    let timer = 0;
    let seq = 0;

    function safeHttp(url) {
      try {
        const u = new URL(url);
        if (u.protocol === "https:" || u.protocol === "http:") return u.href;
      } catch (err) {}
      return "";
    }

    async function load() {
      const b = map.getBounds();
      const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => n.toFixed(4)).join(",");
      const mine = ++seq;
      countEl.textContent = "LOADING";
      try {
        const res = await fetch("/api/cameras.geojson?bbox=" + encodeURIComponent(bbox) + "&max=800");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        if (mine !== seq) return;
        const features = Array.isArray(data.features) ? data.features : [];
        layer.clearLayers();
        for (let i = 0; i < features.length; i++) {
          const f = features[i];
          const coords = f && f.geometry && f.geometry.coordinates;
          if (!coords) continue;
          const props = f.properties || {};
          const marker = L.circleMarker([coords[1], coords[0]], {
            radius: 5, color: "#7ee0ff", weight: 1, fillColor: "#ffe08a", fillOpacity: 0.9
          });
          const name = props.name ? String(props.name) : "Camera";
          const image = safeHttp(props.image || "");
          const stream = safeHttp(props.stream || "");
          let html = "<strong>" + name.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</strong>";
          if (image) html += '<img alt="" src="' + image.replace(/"/g, "%22") + '" />';
          if (stream) html += '<div><a href="' + stream.replace(/"/g, "%22") + '" target="_blank" rel="noopener">STREAM</a></div>';
          marker.bindPopup(html);
          marker.addTo(layer);
        }
        countEl.textContent = features.length + " IN VIEW";
      } catch (err) {
        if (mine !== seq) return;
        countEl.textContent = "FEED UNREACHABLE";
      }
    }

    map.on("moveend", function () {
      clearTimeout(timer);
      timer = setTimeout(load, 250);
    });
    document.getElementById("locate").addEventListener("click", function () {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 10);
      });
    });
    load();
  </script>
</body>
</html>
