<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EXOpace — Cameras</title>
  <meta name="theme-color" content="#03060b" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" /></noscript>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #03060b; color: #d7e7ea; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    body { display: flex; flex-direction: column; min-height: 100%; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      padding: 10px 14px; border-bottom: 1px solid rgba(126, 224, 255, 0.25);
      background: #03060b;
    }
    .brand { color: #7ee0ff; letter-spacing: 0.18em; text-decoration: none; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav a, button.locate {
      color: #ffe08a; text-decoration: none; border: 1px solid rgba(255, 224, 138, 0.45);
      min-height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center;
      background: transparent; font: inherit; letter-spacing: 0.08em;
    }
    nav a[aria-current="page"] { color: #7ee0ff; border-color: rgba(126, 224, 255, 0.7); }
    #count { margin-left: auto; color: #7ee0ff; font-size: 12px; }
    #map { flex: 1; min-height: 0; background: #071018; }
    .leaflet-container { background: #071018; font-family: inherit; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #03060b; color: #d7e7ea; border: 1px solid rgba(126, 224, 255, 0.35); }
    .leaflet-popup-content { margin: 10px 12px; }
    .leaflet-popup-content img { display: block; max-width: 240px; margin-top: 8px; }
    .leaflet-bar a { min-width: 44px; min-height: 44px; line-height: 44px; background: #03060b; color: #7ee0ff; border-bottom-color: rgba(126, 224, 255, 0.35); }
    .leaflet-control-attribution a { display: inline-flex; align-items: center; box-sizing: border-box; min-width: 44px; min-height: 44px; padding: 0 6px; color: #7ee0ff; }
    @media (max-width: 720px) {
      #count { width: 100%; margin-left: 0; }
    }
    .cam-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid rgba(126, 224, 255, 0.25); }
    #cam-q {
      flex: 1 1 160px; min-height: 44px; min-width: 44px; box-sizing: border-box;
      background: transparent; color: #e7f4ef; border: 1px solid rgba(126, 224, 255, 0.35);
      font: inherit; padding: 0 10px;
    }
    .cam-stage { flex: 1; min-height: 0; display: flex; }
  </style>
  <link rel="stylesheet" href="/assets/exo-modern.css?v=5" />
</head>
<body>
<header class="exo-bar">
  <a class="exo-skip" href="#exo-main">Skip to content</a>
  <a class="exo-brand" href="/mission/">EXOPACE</a>
  <nav class="exo-sites" aria-label="EXOpace surfaces">
    <a href="https://cams.exopace.net/map">LIVE MAP</a>
    <a href="/radio/">COMMS &amp; RF</a>
    <a href="/sentinel/">SENTINEL</a>
    <a href="/system/">SYSTEM</a>
  </nav>
</header>
  <div class="cam-status">
    <button class="locate" type="button" id="locate">LOCATE</button>
    <input id="cam-q" type="search" aria-label="Search cameras by name or source" placeholder="Name or source" />
    <button class="locate" type="button" id="cam-prev">PREV</button>
    <button class="locate" type="button" id="cam-next">NEXT</button>
    <button class="locate" type="button" id="cam-share">COPY LINK</button>
    <div id="count">LOADING</div>
  </div>
  <main class="cam-stage" id="exo-main"><div id="map"></div></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const countEl = document.getElementById("count");
    const map = L.map("map", { zoomControl: true, worldCopyJump: true }).setView([39.5, -98.3], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    let timer = 0;
    let seq = 0;
    let features = [];
    let markers = [];
    let cursor = -1;
    let openedHash = false;

    function safeHttp(url) {
      try {
        const u = new URL(url);
        if (u.protocol === "https:" || u.protocol === "http:") return u.href;
      } catch (err) {}
      return "";
    }

    function mediaKind(url) {
      const path = new URL(url).pathname.toLowerCase();
      if (/\.(m3u8|mpd|mp4|webm|mov)$/.test(path) || path.includes(".stream")) return "stream";
      if (/\.(jpe?g|png|gif|webp|bmp|avif)$/.test(path)) return "image";
      return "link";
    }

    function camHash() {
      const match = (location.hash || "").match(/cam=([^&]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function shareUrl(id) {
      const url = new URL(location.href);
      url.hash = "cam=" + encodeURIComponent(id);
      return url.href;
    }

    function draw() {
      const q = (document.getElementById("cam-q").value || "").trim().toLowerCase();
      const shown = features.filter((f) => {
        const props = (f && f.properties) || {};
        if (!q) return true;
        return ((props.name || "") + " " + (props.source || "")).toLowerCase().includes(q);
      });
      layer.clearLayers();
      markers = [];
      for (let i = 0; i < shown.length; i++) {
        const f = shown[i];
        const coords = f && f.geometry && f.geometry.coordinates;
        if (!coords) continue;
        const props = f.properties || {};
        const id = props.id ? String(props.id) : "";
        const marker = L.circleMarker([coords[1], coords[0]], {
          radius: 5, color: "#7ee0ff", weight: 1, fillColor: "#ffe08a", fillOpacity: 0.9
        });
        marker.camId = id;
        const name = props.name ? String(props.name) : "Camera";
        const image = safeHttp(props.image || "");
        const stream = safeHttp(props.stream || "");
        let picture = "";
        let watch = stream;
        if (image) {
          const kind = mediaKind(image);
          if (kind === "image") picture = image;
          else if (!watch) watch = image;
        }
        const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        let html = "<strong>" + esc(name) + "</strong>";
        if (props.source) html += '<div>' + esc(String(props.source)) + "</div>";
        if (picture) html += '<img alt="" src="' + esc(picture) + '" />';
        if (watch) html += '<div><a href="' + esc(watch) + '" target="_blank" rel="noopener">STREAM</a></div>';
        if (id) html += '<div><button type="button" class="cam-copy" data-id="' + esc(id) + '">COPY LINK</button></div>';
        marker.bindPopup(html);
        marker.addTo(layer);
        markers.push(marker);
      }
      const clipped = features.length >= 800;
      countEl.textContent = shown.length + " SHOWN" + (q ? " / " + features.length : "") + (clipped ? " — ZOOM FOR MORE" : "");
      const want = camHash();
      if (want && !openedHash) {
        const hit = markers.find((m) => m.camId === want);
        if (hit) {
          openedHash = true;
          cursor = markers.indexOf(hit);
          map.setView(hit.getLatLng(), Math.max(map.getZoom(), 12));
          hit.openPopup();
        }
      }
    }

    async function ensureHash(list) {
      const want = camHash();
      if (!want || list.some((f) => f && f.properties && String(f.properties.id) === want)) return list;
      try {
        const res = await fetch("/api/cameras.geojson?id=" + encodeURIComponent(want) + "&max=1");
        if (!res.ok) return list;
        const data = await res.json();
        const extra = data && Array.isArray(data.features) ? data.features[0] : null;
        if (extra) return list.concat([extra]);
      } catch (err) {}
      return list;
    }

    async function load() {
      const b = map.getBounds();
      const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => n.toFixed(4)).join(",");
      const mine = ++seq;
      countEl.textContent = "LOADING";
      try {
        const res = await fetch("/api/cameras.geojson?bbox=" + encodeURIComponent(bbox) + "&max=800");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        if (mine !== seq) return;
        features = await ensureHash(Array.isArray(data.features) ? data.features : []);
        if (mine !== seq) return;
        draw();
      } catch (err) {
        if (mine !== seq) return;
        features = [];
        markers = [];
        countEl.textContent = "FEED UNREACHABLE";
      }
    }

    function cycle(step) {
      if (!markers.length) return;
      cursor = (cursor + step + markers.length) % markers.length;
      const marker = markers[cursor];
      if (marker.camId) history.replaceState(null, "", "#cam=" + encodeURIComponent(marker.camId));
      map.setView(marker.getLatLng(), Math.max(map.getZoom(), 11));
      marker.openPopup();
    }

    async function copyLink() {
      const marker = markers[cursor] || markers.find((m) => m.isPopupOpen && m.isPopupOpen());
      const id = marker && marker.camId;
      if (!id) { countEl.textContent = "NO CAMERA"; return; }
      const text = shareUrl(id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
        else throw new Error("no clipboard");
        countEl.textContent = "LINK COPIED";
      } catch (err) {
        countEl.textContent = "COPY FAILED";
      }
    }

    map.on("moveend", function () {
      clearTimeout(timer);
      timer = setTimeout(load, 250);
    });
    document.getElementById("locate").addEventListener("click", function () {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 10);
      });
    });
    document.getElementById("cam-q").addEventListener("input", draw);
    document.getElementById("cam-prev").addEventListener("click", function () { cycle(-1); });
    document.getElementById("cam-next").addEventListener("click", function () { cycle(1); });
    document.getElementById("cam-share").addEventListener("click", copyLink);
    map.on("popupopen", function (event) {
      const root = event.popup.getElement();
      const btn = root && root.querySelector(".cam-copy");
      if (!btn) return;
      btn.addEventListener("click", function () {
        const id = btn.getAttribute("data-id");
        const hit = markers.find((m) => m.camId === id);
        if (hit) cursor = markers.indexOf(hit);
        copyLink();
      });
    });
    document.addEventListener("keydown", function (event) {
      if (document.documentElement.dataset.exoCmd === "open") return;
      const target = event.target;
      if (target && target.closest && target.closest("input, textarea, select")) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.key === "]" || event.key === "n") { event.preventDefault(); cycle(1); }
      else if (event.key === "[" || event.key === "p") { event.preventDefault(); cycle(-1); }
    });
    load();
  </script>
  <script src="/assets/exo-cmd.js?v=1"></script>
</body>
</html>
