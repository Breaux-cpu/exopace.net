<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EXOpace — Cameras</title>
  <meta name="theme-color" content="#03060b" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" /></noscript>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/assets/exo-modern.css?v=14" />
  <link rel="stylesheet" href="/assets/exo-tokens.css" />
  <link rel="stylesheet" href="/assets/exo-layout.css?v=2" data-exo-layout="1" />
  <script src="/assets/exo-layout.js?v=2"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; color: var(--exo-text, #f0f6fc); }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Stage: rail + map. Phone: map full-bleed, rail pieces float over it. */
    .cam-stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
    #map { position: relative; z-index: 0; isolation: isolate; flex: 1 1 auto; min-width: 0; min-height: 0; background: #05080e; }
    .leaflet-container { background: #05080e; font-family: var(--exo-sans, "IBM Plex Sans", system-ui, sans-serif); }

    .cam-rail { display: contents; }
    .cam-kicker {
      margin: 0; color: var(--exo-muted, #9fb0b4);
      font: 500 11px/1.2 var(--exo-mono, "IBM Plex Mono", ui-monospace, monospace);
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .cam-find { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cam-find input {
      flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px;
      border: 1px solid var(--exo-line-field, rgba(126, 224, 255, 0.22)); border-radius: 12px;
      background: rgba(6, 11, 20, 0.92); color: var(--exo-text, #f0f6fc);
      font: 15px/1.2 var(--exo-sans, system-ui, sans-serif);
    }
    .cam-find input::placeholder { color: #7f9298; }
    #count {
      flex: 0 0 auto; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px;
      border-radius: 12px; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
      background: rgba(6, 10, 16, 0.86); color: var(--exo-cyan, #7ee0ff);
      font: 500 11px/1 var(--exo-mono, ui-monospace, monospace); letter-spacing: 0.12em; white-space: nowrap;
    }
    .cam-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .cam-stage .cam-actions .exo-btn { min-width: 0 !important; padding: 0 6px !important; font-size: 11px !important; letter-spacing: 0.1em !important; white-space: nowrap; }
    #cam-list-toggle { display: none; }

    /* Empty / error card: honest, never invented. */
    .cam-empty {
      display: none; margin: 0; padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14)); background: rgba(6, 10, 16, 0.9);
      color: var(--exo-text, #f0f6fc); font: 14px/1.45 var(--exo-sans, system-ui, sans-serif);
    }
    .cam-empty b { display: block; margin-bottom: 4px; font: 600 11px/1.3 var(--exo-mono, monospace); letter-spacing: 0.16em; color: var(--exo-amber, #ffb84d); }
    .cam-empty .exo-btn { margin-top: 10px; }
    body[data-cam-state="empty"] .cam-empty,
    body[data-cam-state="error"] .cam-empty { display: block; }

    /* Camera list (sheet on phones, inline in the rail from 720px). */
    .cam-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .cam-stage #cam-list button {
      width: 100%; min-height: 52px !important; display: grid; gap: 2px; justify-items: start; text-align: left;
      padding: 8px 12px !important; border-radius: 12px !important; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14)) !important;
      background-color: rgba(8, 14, 22, 0.7) !important; color: var(--exo-text, #f0f6fc) !important; cursor: pointer;
      font: 14px/1.3 var(--exo-sans, system-ui, sans-serif) !important; letter-spacing: 0 !important; text-transform: none !important;
    }
    .cam-stage #cam-list button small { color: var(--exo-muted, #9fb0b4); font: 11px/1.2 var(--exo-mono, monospace); letter-spacing: 0.08em; }
    .cam-stage #cam-list button[aria-current="true"] { border-color: rgba(126, 224, 255, 0.7) !important; box-shadow: inset 3px 0 0 var(--exo-cyan, #7ee0ff) !important; }
    .cam-list-note { margin: 8px 2px 0; color: var(--exo-muted, #9fb0b4); font: 12px/1.4 var(--exo-sans, system-ui, sans-serif); }
    .cam-list-note:empty { display: none; }

    /* Leaflet chrome in the shell's language. */
    .leaflet-bar { border: 0 !important; box-shadow: none !important; display: grid; gap: 8px; }
    html body .leaflet-bar a, html body .leaflet-bar a:hover {
      width: 44px !important; height: 44px !important; line-height: 44px !important;
      border-radius: 12px !important; border: 1px solid var(--exo-line-btn, rgba(186, 214, 226, 0.18)) !important;
      background: rgba(6, 10, 16, 0.88) !important; color: var(--exo-text, #f0f6fc) !important; font: 400 20px/42px var(--exo-sans, system-ui) !important;
    }
    .leaflet-control-attribution {
      background: rgba(6, 10, 16, 0.78) !important; color: #b9c6cc !important; border-radius: 8px 0 0 0;
      font: 10px/1.3 var(--exo-sans, system-ui, sans-serif) !important; padding: 2px 6px !important;
    }
    .leaflet-control-attribution a { color: var(--exo-cyan, #7ee0ff) !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(6, 10, 16, 0.96); color: var(--exo-text, #f0f6fc);
      border: 1px solid rgba(198, 216, 226, 0.2); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .leaflet-popup-content { margin: 12px 14px; min-width: 200px; font: 14px/1.4 var(--exo-sans, system-ui, sans-serif); }
    .leaflet-popup-content strong { display: block; font-weight: 600; margin-bottom: 2px; padding-right: 28px; }
    .leaflet-popup-content .cam-src { color: var(--exo-muted, #9fb0b4); font: 11px/1.3 var(--exo-mono, monospace); letter-spacing: 0.08em; }
    .leaflet-popup-content img { display: block; width: 100%; max-width: 260px; margin-top: 10px; border-radius: 10px; }
    .leaflet-popup-content .cam-pop-actions { display: flex; gap: 8px; margin-top: 10px; }
    .leaflet-popup-content .cam-pop-actions > * { flex: 1 1 0; }
    .leaflet-container a.leaflet-popup-close-button { width: 44px; height: 44px; font: 22px/44px var(--exo-sans, system-ui); color: var(--exo-muted, #9fb0b4); top: 0; right: 0; }

    /* —— Phone (cover screens): floating search on top, thumb bar above the shell dock —— */
    @media (max-width: 719px) and (min-height: 501px) {
      .cam-find, .cam-empty, .cam-actions { position: absolute; z-index: 30; left: calc(12px + var(--exo-sal, 0px)); right: calc(12px + var(--exo-sar, 0px)); }
      .cam-find { top: 12px; }
      .cam-kicker { display: none; }
      .cam-empty { top: 68px; right: calc(68px + var(--exo-sar, 0px)); }
      .cam-actions {
        bottom: calc(var(--exo-dock-real, calc(var(--exo-dock-h) + var(--exo-sab))) + 12px);
        grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; gap: 6px;
        border-radius: 16px; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
        background: rgba(6, 10, 16, 0.9); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .cam-stage .cam-actions .exo-btn { border-color: transparent !important; background-color: transparent !important; box-shadow: none !important; font-size: 10.5px !important; letter-spacing: 0.06em !important; }
      .cam-stage .cam-actions .exo-btn[aria-expanded="true"] { color: var(--exo-cyan, #7ee0ff) !important; }
      #cam-list-toggle { display: inline-flex; }
      body.exo-sheet-open .cam-actions, body.exo-sheet-open .cam-find, body.exo-sheet-open .cam-empty { visibility: hidden; }
      .leaflet-top { top: 68px; }
      html body .leaflet-bottom { bottom: calc(var(--exo-dock-real, calc(var(--exo-dock-h) + var(--exo-sab))) + 80px) !important; }
      .cam-sheet .exo-sheet-panel { bottom: 0; }
      .cam-sheet .exo-sheet-body { padding-bottom: 8px; }
    }

    /* —— Fold inner / tablet / desktop / landscape: two-pane with a left rail —— */
    @media (min-width: 720px), (max-height: 500px) {
      .cam-rail {
        display: flex; flex-direction: column; gap: 12px; flex: 0 0 min(360px, 40vw); min-height: 0;
        padding: 16px 16px calc(16px + var(--exo-dock-real, calc(var(--exo-dock-h) + var(--exo-sab))));
        border-right: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
        background: rgba(5, 9, 15, 0.92); overflow: hidden;
      }
      .cam-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #locate { order: 1; } #cam-share { order: 2; } #cam-prev { order: 3; } #cam-next { order: 4; }
      .cam-rail > * { flex-shrink: 0; }
      .cam-rail > .cam-sheet { flex-shrink: 1; }
      body[data-cam-state="error"] .cam-list-note { display: none; }
      .cam-sheet, .cam-sheet[data-open], .cam-sheet.is-open {
        display: flex !important; position: static !important; inset: auto !important; z-index: auto;
        flex: 1 1 auto; min-height: 0; pointer-events: auto;
      }
      .cam-sheet .exo-sheet-scrim, .cam-sheet .exo-sheet-close { display: none !important; }
      .cam-sheet .exo-sheet-panel {
        position: static !important; inset: auto !important; width: auto !important; max-height: none !important;
        flex: 1 1 auto; min-height: 0; padding: 0 !important; border: 0 !important; border-radius: 0 !important;
        background: transparent !important; box-shadow: none !important;
      }
      .cam-sheet .exo-sheet-head { min-height: 28px; }
      .cam-sheet .exo-sheet-title { color: var(--exo-muted, #9fb0b4); font-size: 11px; }
    }
    @media (max-height: 500px) {
      .cam-rail { flex-basis: min(300px, 42vw); padding: 10px 12px calc(10px + var(--exo-dock-real, calc(var(--exo-dock-h) + var(--exo-sab)))); gap: 8px; overflow: auto; }
      .cam-kicker { display: none; }
      .cam-find { flex-wrap: wrap; }
      .cam-find input { flex-basis: 100%; }
      .cam-sheet { flex: 0 0 auto; }
      .cam-sheet .exo-sheet-body { overflow: visible; }
    }
  </style>
</head>
<body data-cam-state="loading">
<header class="exo-bar">
  <a class="exo-skip" href="#exo-main">Skip to content</a>
  <a class="exo-brand" href="/mission/">EXOPACE</a>
  <nav class="exo-sites" aria-label="EXOpace surfaces">
    <a href="https://cams.exopace.net/map">LIVE MAP</a>
    <a href="/radio/">COMMS &amp; RF</a>
    <a href="/sentinel/">SENTINEL</a>
    <a href="/system/">SYSTEM</a>
  </nav>
</header>
<div class="exo-pill" id="exo-pill" aria-live="polite">
  <span id="exo-pill-clock">UTC — · JD —</span>
  <span id="exo-pill-fix">NO FIX</span>
  <span id="exo-pill-target">NO TARGET</span>
  <button type="button" id="exo-pill-copy">COPY</button>
  <a id="exo-pill-jump" href="https://cams.exopace.net/map">JUMP</a>
</div>
  <main class="cam-stage" id="exo-main">
    <aside class="cam-rail" aria-label="Cameras">
      <p class="cam-kicker">Public cameras</p>
      <div class="cam-find">
        <input id="cam-q" type="search" aria-label="Search cameras by name or source" placeholder="Search name or source" enterkeyhint="search" autocomplete="off" />
        <div id="count" role="status" aria-live="polite">LOADING</div>
      </div>
      <div class="cam-empty" id="cam-empty" role="status">
        <b id="cam-empty-title">NO CAMERAS IN VIEW</b>
        <span id="cam-empty-text">Pan or zoom out to look somewhere else.</span>
        <div><button class="exo-btn" type="button" id="cam-retry">RETRY</button></div>
      </div>
      <div class="cam-actions" role="toolbar" aria-label="Camera controls">
        <button class="exo-btn" type="button" id="locate">LOCATE</button>
        <button class="exo-btn" type="button" id="cam-list-toggle" data-exo-sheet-toggle aria-controls="cam-sheet" aria-expanded="false">LIST</button>
        <button class="exo-btn" type="button" id="cam-prev" aria-label="Previous camera">PREV</button>
        <button class="exo-btn" type="button" id="cam-next" aria-label="Next camera">NEXT</button>
        <button class="exo-btn" type="button" id="cam-share">SHARE</button>
      </div>
      <div class="exo-sheet cam-sheet" id="cam-sheet" data-open="false">
        <button class="exo-sheet-scrim" type="button" aria-label="Close camera list" tabindex="-1"></button>
        <div class="exo-sheet-panel" role="dialog" aria-labelledby="cam-sheet-title">
          <div class="exo-sheet-head">
            <h2 class="exo-sheet-title" id="cam-sheet-title">Cameras in view</h2>
            <button class="exo-btn exo-btn-ghost exo-sheet-close" type="button" data-exo-sheet-close>CLOSE</button>
          </div>
          <div class="exo-sheet-body">
            <ul class="cam-list" id="cam-list"></ul>
            <p class="cam-list-note" id="cam-list-note"></p>
          </div>
        </div>
      </div>
    </aside>
    <div id="map" role="region" aria-label="Camera map"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("cam-list");
    const listNote = document.getElementById("cam-list-note");
    const LIST_MAX = 150;
    const map = L.map("map", { zoomControl: false, worldCopyJump: true }).setView([39.5, -98.3], 4);
    L.control.zoom({ position: "topright" }).addTo(map);
    // CARTO basemaps now return "API key required" tiles. Esri's dark canvas is keyless with attribution.
    const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
    L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Esri, HERE, Garmin, &copy; OpenStreetMap contributors",
      maxNativeZoom: 16, maxZoom: 19
    }).addTo(map);
    L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19 }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    let timer = 0;
    let seq = 0;
    let features = [];
    let markers = [];
    let cursor = -1;
    let openedHash = false;
    let baseCount = "LOADING";
    let flashUntil = 0;

    function setCount(t) {
      baseCount = t;
      if (Date.now() >= flashUntil) countEl.textContent = t;
    }

    function flash(t) {
      countEl.textContent = t;
      flashUntil = Date.now() + 2500;
      setTimeout(function () { if (Date.now() >= flashUntil) countEl.textContent = baseCount; }, 2600);
    }

    function popPad() {
      const phone = matchMedia("(max-width: 719px) and (min-height: 501px)").matches;
      return phone ? { tl: [16, 80], br: [16, 150] } : { tl: [24, 24], br: [24, 24] };
    }

    function setState(state, title, text) {
      document.body.dataset.camState = state;
      if (title) document.getElementById("cam-empty-title").textContent = title;
      if (text) document.getElementById("cam-empty-text").textContent = text;
    }

    function safeHttp(url) {
      try {
        const u = new URL(url);
        if (u.protocol === "https:" || u.protocol === "http:") return u.href;
      } catch (err) {}
      return "";
    }

    function mediaKind(url) {
      const path = new URL(url).pathname.toLowerCase();
      if (/\.(m3u8|mpd|mp4|webm|mov)$/.test(path) || path.includes(".stream")) return "stream";
      if (/\.(jpe?g|png|gif|webp|bmp|avif)$/.test(path)) return "image";
      return "link";
    }

    function camHash() {
      const match = (location.hash || "").match(/cam=([^&]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function shareUrl(id) {
      const url = new URL(location.href);
      url.hash = "cam=" + encodeURIComponent(id);
      return url.href;
    }

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function markCurrent() {
      for (const b of listEl.querySelectorAll("button")) b.setAttribute("aria-current", String(Number(b.dataset.i) === cursor));
    }

    function drawList() {
      listEl.textContent = "";
      const n = Math.min(markers.length, LIST_MAX);
      for (let i = 0; i < n; i++) {
        const m = markers[i];
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.i = String(i);
        b.innerHTML = esc(m.camName) + (m.camSource ? "<small>" + esc(m.camSource) + "</small>" : "");
        li.appendChild(b);
        listEl.appendChild(li);
      }
      listNote.textContent = markers.length > LIST_MAX ? (markers.length - LIST_MAX) + " more on the map. Zoom in to narrow the list." : (markers.length ? "" : "No cameras in this view.");
      markCurrent();
    }

    function draw() {
      const prev = markers[cursor] || markers.find((m) => m.isPopupOpen && m.isPopupOpen());
      const keepId = prev ? prev.camId : "";
      const keepOpen = !!(prev && prev.isPopupOpen && prev.isPopupOpen());
      const q = (document.getElementById("cam-q").value || "").trim().toLowerCase();
      const shown = features.filter((f) => {
        const props = (f && f.properties) || {};
        if (!q) return true;
        return ((props.name || "") + " " + (props.source || "")).toLowerCase().includes(q);
      });
      layer.clearLayers();
      markers = [];
      cursor = -1;
      for (let i = 0; i < shown.length; i++) {
        const f = shown[i];
        const coords = f && f.geometry && f.geometry.coordinates;
        if (!coords) continue;
        const props = f.properties || {};
        const id = props.id ? String(props.id) : "";
        const name = props.name ? String(props.name) : "Camera";
        const marker = L.circleMarker([coords[1], coords[0]], {
          radius: 6, color: "#7ee0ff", weight: 1.5, fillColor: "#ffb84d", fillOpacity: 0.95
        });
        marker.camId = id;
        marker.camName = name;
        marker.camSource = props.source ? String(props.source) : "";
        const image = safeHttp(props.image || "");
        const stream = safeHttp(props.stream || "");
        let picture = "";
        let watch = stream;
        if (image) {
          const kind = mediaKind(image);
          if (kind === "image") picture = image;
          else if (!watch) watch = image;
        }
        let html = "<strong>" + esc(name) + "</strong>";
        if (props.source) html += '<div class="cam-src">' + esc(String(props.source)) + "</div>";
        if (picture) html += '<img alt="" src="' + esc(picture) + '" />';
        let acts = "";
        if (watch) acts += '<a class="exo-btn" href="' + esc(watch) + '" target="_blank" rel="noopener">STREAM</a>';
        if (id) acts += '<button type="button" class="exo-btn cam-copy" data-id="' + esc(id) + '">COPY LINK</button>';
        if (acts) html += '<div class="cam-pop-actions">' + acts + "</div>";
        const pad = popPad();
        marker.bindPopup(html, { autoPanPaddingTopLeft: pad.tl, autoPanPaddingBottomRight: pad.br, maxWidth: 280 });
        marker.on("click", function () { cursor = markers.indexOf(marker); markCurrent(); publishCam(marker); });
        marker.addTo(layer);
        markers.push(marker);
      }
      const clipped = features.length >= 800;
      setCount(shown.length + (q ? " / " + features.length : "") + " IN VIEW" + (clipped ? " · ZOOM FOR MORE" : ""));
      if (!features.length) setState("empty", "NO CAMERAS IN VIEW", "The camera feed has no cameras here. Pan or zoom out to look somewhere else.");
      else if (!shown.length) setState("empty", "NO MATCHES", "No camera in this view matches “" + q + "”.");
      else setState("ready");
      if (keepId) {
        const again = markers.find((m) => m.camId === keepId);
        if (again) {
          cursor = markers.indexOf(again);
          if (keepOpen) again.openPopup();
        }
      }
      drawList();
      const want = camHash();
      if (want && !openedHash) {
        const hit = markers.find((m) => m.camId === want);
        if (hit) {
          openedHash = true;
          cursor = markers.indexOf(hit);
          map.setView(hit.getLatLng(), Math.max(map.getZoom(), 12));
          hit.openPopup();
          publishCam(hit);
          markCurrent();
        }
      }
    }

    async function ensureHash(list) {
      const want = camHash();
      if (!want || list.some((f) => f && f.properties && String(f.properties.id) === want)) return list;
      try {
        const res = await fetch("/api/cameras.geojson?id=" + encodeURIComponent(want) + "&max=1");
        if (!res.ok) return list;
        const data = await res.json();
        const extra = data && Array.isArray(data.features) ? data.features[0] : null;
        if (extra) return list.concat([extra]);
      } catch (err) {}
      return list;
    }

    async function load() {
      const b = map.getBounds();
      const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => n.toFixed(4)).join(",");
      const mine = ++seq;
      setCount("LOADING");
      try {
        const res = await fetch("/api/cameras.geojson?bbox=" + encodeURIComponent(bbox) + "&max=800");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        if (mine !== seq) return;
        features = await ensureHash(Array.isArray(data.features) ? data.features : []);
        if (mine !== seq) return;
        draw();
      } catch (err) {
        if (mine !== seq) return;
        features = [];
        markers = [];
        cursor = -1;
        layer.clearLayers();
        drawList();
        setCount("FEED OFFLINE");
        setState("error", "CAMERA FEED UNREACHABLE", "The camera list did not answer. Nothing is shown rather than a guess.");
      }
    }

    function focusMarker(i) {
      const marker = markers[i];
      if (!marker) return;
      cursor = i;
      if (marker.camId) history.replaceState(null, "", "#cam=" + encodeURIComponent(marker.camId));
      map.setView(marker.getLatLng(), Math.max(map.getZoom(), 11));
      marker.openPopup();
      publishCam(marker);
      markCurrent();
    }

    function cycle(step) {
      if (!markers.length) { flash("NO CAMERAS"); return; }
      focusMarker((cursor + step + markers.length) % markers.length);
    }

    function publishCam(marker) {
      if (!marker || !window.EXO || !EXO.bus) return;
      const ll = marker.getLatLng();
      EXO.bus.set({
        kind: "camera",
        id: marker.camId || "",
        label: marker.camName || "CAMERA",
        lat: ll.lat,
        lon: ll.lng,
      });
    }

    async function copyLink() {
      const marker = markers[cursor] || markers.find((m) => m.isPopupOpen && m.isPopupOpen());
      const id = marker && marker.camId;
      if (!id) { flash("PICK A CAMERA"); return; }
      const text = shareUrl(id);
      try {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) { await navigator.share({ title: marker.camName, url: text }); flash("SHARED"); return; }
      } catch (err) { if (err && err.name === "AbortError") return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
        else throw new Error("no clipboard");
        flash("LINK COPIED");
      } catch (err) {
        flash("COPY FAILED");
      }
    }

    map.on("moveend", function () {
      clearTimeout(timer);
      timer = setTimeout(load, 250);
    });
    document.getElementById("locate").addEventListener("click", function () {
      if (!navigator.geolocation) { flash("NO LOCATION"); return; }
      flash("LOCATING");
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 10);
      }, function () { flash("LOCATION DENIED"); }, { timeout: 10000 });
    });
    document.getElementById("cam-q").addEventListener("input", function () { flashUntil = 0; draw(); });
    document.getElementById("cam-prev").addEventListener("click", function () { cycle(-1); });
    document.getElementById("cam-next").addEventListener("click", function () { cycle(1); });
    document.getElementById("cam-share").addEventListener("click", copyLink);
    document.getElementById("cam-retry").addEventListener("click", load);
    listEl.addEventListener("click", function (event) {
      const b = event.target.closest("button[data-i]");
      if (!b) return;
      if (window.EXO_LAYOUT && matchMedia("(max-width: 719px) and (min-height: 501px)").matches) EXO_LAYOUT.closeSheet(document.getElementById("cam-sheet"));
      focusMarker(Number(b.dataset.i));
    });
    map.on("popupopen", function (event) {
      const root = event.popup.getElement();
      const btn = root && root.querySelector(".cam-copy");
      if (!btn) return;
      btn.addEventListener("click", function () {
        const id = btn.getAttribute("data-id");
        const hit = markers.find((m) => m.camId === id);
        if (hit) cursor = markers.indexOf(hit);
        copyLink();
      });
    });
    addEventListener("resize", function () { map.invalidateSize(); });
    document.addEventListener("keydown", function (event) {
      if (document.documentElement.dataset.exoCmd === "open") return;
      const target = event.target;
      if (target && target.closest && target.closest("input, textarea, select")) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.key === "]" || event.key === "n") { event.preventDefault(); cycle(1); }
      else if (event.key === "[" || event.key === "p") { event.preventDefault(); cycle(-1); }
    });
    load();
  </script>
  <script src="/maps/mgrs.js"></script>
  <script src="/assets/exo-bus.js"></script>
  <script src="/assets/exo-state.js"></script>
  <script src="/assets/exo-cmd.js?v=1"></script>
</body>
</html>
