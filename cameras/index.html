<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070d" />
  <title>EXOpace — Cameras</title>
  <link rel="canonical" href="https://cams.exopace.net/map" />
  <style>
    html, body { margin: 0; min-height: 100dvh; background: #04070d; color: #7ee0ff;
      font-family: "IBM Plex Mono", ui-monospace, monospace; }
    body { display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px)); }
    a { display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; min-width: 44px; padding: 0 14px;
      color: #7ee0ff; text-decoration: none; border: 1px solid rgba(126, 224, 255, 0.35); border-radius: 10px; }
    a:focus-visible { outline: 2px solid #ffb84d; outline-offset: 2px; }
    p { margin: 0; text-align: center; }
  </style>
  <script>
    (function () {
      var dest = "https://cams.exopace.net/map";
      var hash = (location.hash || "").replace(/^#/, "");
      var params = new URLSearchParams(hash);
      var id = params.get("cam");
      var at = params.get("at");
      if (id && id.trim()) {
        /* cams looks the camera up by id, so a link without &at= still opens it. */
        dest += "?camera=" + encodeURIComponent(id.trim());
        var parts = String(at || "").split(",");
        var lat = parts[0] && parts[0].trim();
        var lon = parts[1] && parts[1].trim();
        if (lat && lon && isFinite(Number(lat)) && isFinite(Number(lon))) {
          dest += "&lat=" + encodeURIComponent(lat) +
            "&lon=" + encodeURIComponent(lon) +
            "&z=13";
        }
      }
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Cameras now live on <a href="https://cams.exopace.net/map">cams.exopace.net</a>.</p>
  <noscript>
    <p><a href="https://cams.exopace.net/map">Open Cameras on cams.exopace.net</a></p>
  </noscript>
</body>
</html>
