<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EXOpace — Cameras</title>
  <meta name="theme-color" content="#03060b" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=optional" /></noscript>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/assets/exo-modern.css?v=14" />
  <link rel="stylesheet" href="/assets/exo-tokens.css" />
  <link rel="stylesheet" href="/assets/exo-layout.css?v=7" data-exo-layout="1" />
  <script src="/assets/exo-layout.js?v=6"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; color: var(--exo-text, #f0f6fc); }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Stage: rail + map. Phone: map full-bleed, rail pieces float over it. */
    .cam-stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
    #map { position: relative; z-index: 0; isolation: isolate; flex: 1 1 auto; min-width: 0; min-height: 0; background: #05080e; }
    .leaflet-container { background: #05080e; font-family: var(--exo-sans, "IBM Plex Sans", system-ui, sans-serif); }

    .cam-rail { display: contents; }
    .cam-kicker {
      margin: 0; color: var(--exo-muted, #9fb0b4);
      font: 500 11px/1.2 var(--exo-mono, "IBM Plex Mono", ui-monospace, monospace);
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .cam-find { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cam-find input {
      flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px;
      border: 1px solid var(--exo-line-field, rgba(126, 224, 255, 0.22)); border-radius: 12px;
      background: rgba(6, 11, 20, 0.92); color: var(--exo-text, #f0f6fc);
      font: 15px/1.2 var(--exo-sans, system-ui, sans-serif);
    }
    .cam-find input::placeholder { color: #7f9298; }
    #count {
      flex: 0 1 auto; min-width: 0; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px;
      border-radius: 12px; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
      background: rgba(6, 10, 16, 0.86); color: var(--exo-cyan, #7ee0ff);
      font: 500 11px/1 var(--exo-mono, ui-monospace, monospace); letter-spacing: 0.12em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%;
    }
    @media (max-width: 719px) {
      .cam-find { flex-wrap: wrap; }
      .cam-find input { flex: 1 1 100%; }
      #count { flex: 1 1 auto; max-width: none; }
    }
    .cam-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .cam-stage .cam-actions .exo-btn { min-width: 0 !important; padding: 0 6px !important; font-size: 11px !important; letter-spacing: 0.1em !important; white-space: nowrap; }
    #cam-list-toggle { display: none; }

    /* Empty / error card: honest, never invented. */
    .cam-empty {
      display: none; margin: 0; padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14)); background: rgba(6, 10, 16, 0.9);
      color: var(--exo-text, #f0f6fc); font: 14px/1.45 var(--exo-sans, system-ui, sans-serif);
    }
    .cam-empty b { display: block; margin-bottom: 4px; font: 600 11px/1.3 var(--exo-mono, monospace); letter-spacing: 0.16em; color: var(--exo-amber, #ffb84d); }
    .cam-empty .exo-btn { margin-top: 10px; }
    body[data-cam-state="empty"] .cam-empty,
    body[data-cam-state="error"] .cam-empty { display: block; }

    /* Camera list (sheet on phones, inline in the rail from 720px). */
    .cam-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .cam-stage #cam-list button {
      width: 100%; min-height: 52px !important; display: grid; gap: 2px; justify-items: start; text-align: left;
      padding: 8px 12px !important; border-radius: 12px !important; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14)) !important;
      background-color: rgba(8, 14, 22, 0.7) !important; color: var(--exo-text, #f0f6fc) !important; cursor: pointer;
      font: 14px/1.3 var(--exo-sans, system-ui, sans-serif) !important; letter-spacing: 0 !important; text-transform: none !important;
    }
    .cam-stage #cam-list button small { color: var(--exo-muted, #9fb0b4); font: 11px/1.2 var(--exo-mono, monospace); letter-spacing: 0.08em; }
    .cam-stage #cam-list button[aria-current="true"] { border-color: rgba(126, 224, 255, 0.7) !important; box-shadow: inset 3px 0 0 var(--exo-cyan, #7ee0ff) !important; }
    .cam-list-note { margin: 8px 2px 0; color: var(--exo-muted, #9fb0b4); font: 12px/1.4 var(--exo-sans, system-ui, sans-serif); }
    .cam-list-note:empty { display: none; }

    /* Leaflet chrome in the shell's language. */
    .leaflet-bar { border: 0 !important; box-shadow: none !important; display: grid; gap: 8px; }
    html body .leaflet-bar a, html body .leaflet-bar a:hover {
      width: 44px !important; height: 44px !important; line-height: 44px !important;
      border-radius: 12px !important; border: 1px solid var(--exo-line-btn, rgba(186, 214, 226, 0.18)) !important;
      background: rgba(6, 10, 16, 0.88) !important; color: var(--exo-text, #f0f6fc) !important; font: 400 20px/42px var(--exo-sans, system-ui) !important;
    }
    .leaflet-control-attribution {
      background: rgba(6, 10, 16, 0.78) !important; color: #b9c6cc !important; border-radius: 8px 0 0 0;
      font: 10px/1.3 var(--exo-sans, system-ui, sans-serif) !important; padding: 2px 6px !important;
    }
    .leaflet-control-attribution a { color: var(--exo-cyan, #7ee0ff) !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(6, 10, 16, 0.96); color: var(--exo-text, #f0f6fc);
      border: 1px solid rgba(198, 216, 226, 0.2); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .leaflet-popup-content { margin: 12px 14px; min-width: 200px; font: 14px/1.4 var(--exo-sans, system-ui, sans-serif); }
    .leaflet-popup-content strong { display: block; font-weight: 600; margin-bottom: 2px; padding-right: 28px; }
    .leaflet-popup-content .cam-src { color: var(--exo-muted, #9fb0b4); font: 11px/1.3 var(--exo-mono, monospace); letter-spacing: 0.08em; }
    .leaflet-popup-content img, .leaflet-popup-content video { display: block; width: 100%; max-width: 260px; margin-top: 10px; border-radius: 10px; background: #05080c; }
    .cam-player { position: relative; width: 260px; max-width: 100%; aspect-ratio: 16 / 9; margin-top: 10px; border-radius: 10px; background: #05080c; border: 1px solid rgba(126, 224, 255, 0.16); overflow: hidden; }
    .cam-player img, .cam-player video { position: absolute; inset: 0; width: 100% !important; height: 100% !important; max-width: none !important; margin: 0 !important; object-fit: contain; border-radius: 0 !important; }
    .cam-player[data-state="loading"] img, .cam-player[data-state="loading"] video { opacity: 0; }
    .cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 12px; text-align: center; font: 11px/1.35 var(--exo-mono, monospace); letter-spacing: 0.06em; color: var(--exo-muted, #9fb0b4); }
    .cam-msg b { color: #ffb84d; font-weight: 600; letter-spacing: 0.12em; }
    .cam-player[data-state="playing"] .cam-msg { display: none; }
    .cam-player .cam-live { position: absolute; left: 8px; top: 8px; padding: 2px 6px; border-radius: 6px; background: rgba(5, 8, 12, 0.75); color: #7ee0ff; font: 600 10px/1.4 var(--exo-mono, monospace); letter-spacing: 0.1em; }
    .cam-player:not([data-state="playing"]) .cam-live { display: none; }
    .cam-player .cam-credit { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 8px; background: rgba(5, 8, 12, 0.72); color: #c9d6dc; font: 9.5px/1.3 var(--exo-mono, monospace); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .cam-player:not([data-state="playing"]) .cam-credit { display: none; }
    /* Phones pinch to zoom; while a camera is open its popup gets the top-right corner. */
    @media (max-width: 719px) and (min-height: 501px) { .cam-stage:has(.leaflet-popup) #map .leaflet-control-zoom, .cam-stage:has(.leaflet-popup) .cam-find { visibility: hidden; } }
    @media (max-height: 500px) { .cam-stage:has(.leaflet-popup) #map .leaflet-control-zoom { visibility: hidden; } }
    @media (max-width: 719px) and (max-height: 700px) { .cam-player { aspect-ratio: 2 / 1; } .leaflet-popup-content .cam-pop-actions { margin-top: 8px; } }
    .leaflet-popup-content .cam-pop-actions { display: flex; gap: 8px; margin-top: 10px; }
    .leaflet-popup-content .cam-pop-actions > * { flex: 1 1 0; }
    .leaflet-container a.leaflet-popup-close-button { width: 44px; height: 44px; font: 22px/44px var(--exo-sans, system-ui); color: var(--exo-muted, #9fb0b4); top: 0; right: 0; }

    /* —— Phone (cover screens): floating search on top, thumb bar above the shell dock —— */
    @media (max-width: 719px) and (min-height: 501px) {
      .cam-find, .cam-empty, .cam-actions { position: absolute; z-index: 30; left: calc(12px + var(--exo-sal, 0px)); right: calc(12px + var(--exo-sar, 0px)); }
      .cam-find { top: 12px; }
      .cam-kicker { display: none; }
      .cam-empty { top: 68px; right: calc(68px + var(--exo-sar, 0px)); }
      .cam-actions {
        bottom: calc(var(--exo-dock-real, calc(var(--exo-dock-h, 0px) + var(--exo-sab, 0px))) + 12px);
        grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; gap: 6px;
        border-radius: 16px; border: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
        background: rgba(6, 10, 16, 0.9); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .cam-stage .cam-actions .exo-btn { border-color: transparent !important; background-color: transparent !important; box-shadow: none !important; font-size: 10.5px !important; letter-spacing: 0.06em !important; }
      .cam-stage .cam-actions .exo-btn[aria-expanded="true"] { color: var(--exo-cyan, #7ee0ff) !important; }
      #cam-list-toggle { display: inline-flex; }
      body.exo-sheet-open .cam-actions, body.exo-sheet-open .cam-find, body.exo-sheet-open .cam-empty, body.exo-sheet-open #map .leaflet-control-zoom { visibility: hidden; }
      .leaflet-top { top: 68px; }
      html body .leaflet-bottom { bottom: calc(var(--exo-dock-real, calc(var(--exo-dock-h, 0px) + var(--exo-sab, 0px))) + 80px) !important; }
      .cam-sheet .exo-sheet-panel { bottom: 0; }
      .cam-sheet .exo-sheet-body { padding-bottom: 8px; }
    }

    /* —— Fold inner / tablet / desktop / landscape: two-pane with a left rail —— */
    @media (min-width: 720px), (max-height: 500px) {
      .cam-rail {
        display: flex; flex-direction: column; gap: 12px; flex: 0 0 min(360px, 40vw); min-height: 0;
        padding: 16px 16px calc(16px + var(--exo-dock-real, calc(var(--exo-dock-h, 0px) + var(--exo-sab, 0px))));
        border-right: 1px solid var(--exo-line, rgba(186, 214, 226, 0.14));
        background: rgba(5, 9, 15, 0.92); overflow: hidden;
      }
      .cam-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #locate { order: 1; } #cam-share { order: 2; } #cam-prev { order: 3; } #cam-next { order: 4; }
      .cam-rail > * { flex-shrink: 0; }
      .cam-rail > .cam-sheet { flex-shrink: 1; }
      body[data-cam-state="error"] .cam-list-note { display: none; }
      .cam-sheet, .cam-sheet[data-open], .cam-sheet.is-open {
        display: flex !important; position: static !important; inset: auto !important; z-index: auto;
        flex: 1 1 auto; min-height: 0; pointer-events: auto;
      }
      .cam-sheet .exo-sheet-scrim, .cam-sheet .exo-sheet-close { display: none !important; }
      .cam-sheet .exo-sheet-panel {
        position: static !important; inset: auto !important; width: auto !important; max-height: none !important;
        flex: 1 1 auto; min-height: 0; padding: 0 !important; border: 0 !important; border-radius: 0 !important;
        background: transparent !important; box-shadow: none !important;
      }
      .cam-sheet .exo-sheet-head { min-height: 28px; }
      .cam-sheet .exo-sheet-title { color: var(--exo-muted, #9fb0b4); font-size: 11px; }
    }
    @media (max-height: 500px) {
      .cam-rail { flex-basis: min(300px, 42vw); padding: 10px 12px calc(10px + var(--exo-dock-real, calc(var(--exo-dock-h, 0px) + var(--exo-sab, 0px)))); gap: 8px; overflow: auto; }
      .cam-kicker { display: none; }
      .cam-find { flex-wrap: wrap; }
      .cam-find input { flex-basis: 100%; }
      .cam-sheet { flex: 0 0 auto; }
      .cam-sheet .exo-sheet-body { overflow: visible; }
    }

    #cam-toast {
      position: fixed; z-index: 10000; left: 50%; top: calc(12px + var(--exo-sat, env(safe-area-inset-top, 0px)));
      transform: translateX(-50%);
      max-width: min(92vw, 360px); padding: 10px 16px; border-radius: 12px;
      background: rgba(6, 10, 16, 0.94); color: #e8f0f4;
      border: 1px solid rgba(126, 224, 255, 0.4);
      font: 600 12px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.12em;
      text-transform: uppercase; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    #cam-toast[hidden] { display: none; }
  </style>
</head>
<body data-cam-state="loading">
<div id="cam-toast" role="status" aria-live="polite" hidden></div>
<header class="exo-bar">
  <a class="exo-skip" href="#exo-main">Skip to content</a>
  <a class="exo-brand" href="/" aria-label="EXOpace home">EXOPACE</a>
  <nav class="exo-sites" aria-label="EXOpace surfaces">
    <a href="/">Home</a>
    <a href="/mission/">Mission</a>
    <a href="/radio/">Radio</a>
    <a href="/mesh/">Mesh</a>
    <a href="/maps/">Field Maps</a>
    <a href="/cameras/" aria-current="page">Cameras</a>
    <a href="/sentinel/">Sentinel</a>
    <a href="/system/">System</a>
  </nav>
</header>
<div class="exo-pill" id="exo-pill" aria-live="polite">
  <span id="exo-pill-clock">UTC — · JD —</span>
  <span id="exo-pill-fix">NO FIX</span>
  <span id="exo-pill-target">NO TARGET</span>
  <button type="button" id="exo-pill-copy">COPY</button>
  <a id="exo-pill-jump" href="https://cams.exopace.net/map">JUMP</a>
</div>
  <main class="cam-stage" id="exo-main">
    <aside class="cam-rail" aria-label="Cameras">
      <p class="cam-kicker">Public cameras</p>
      <div class="cam-find">
        <input id="cam-q" type="search" aria-label="Search cameras by name or source" placeholder="Search name or source" enterkeyhint="search" autocomplete="off" />
        <div id="count" role="status" aria-live="polite">LOADING</div>
      </div>
      <div class="cam-empty" id="cam-empty" role="status">
        <b id="cam-empty-title">NO CAMERAS IN VIEW</b>
        <span id="cam-empty-text">Pan or zoom out to look somewhere else.</span>
        <div>
          <button class="exo-btn" type="button" id="cam-retry">RETRY</button>
          <button class="exo-btn" type="button" id="cam-search-all" hidden>SEARCH ALL</button>
        </div>
      </div>
      <div class="cam-actions" role="toolbar" aria-label="Camera controls">
        <button class="exo-btn" type="button" id="locate">LOCATE</button>
        <button class="exo-btn" type="button" id="cam-list-toggle" data-exo-sheet-toggle aria-controls="cam-sheet" aria-expanded="false">LIST</button>
        <button class="exo-btn" type="button" id="cam-prev" aria-label="Previous camera">PREV</button>
        <button class="exo-btn" type="button" id="cam-next" aria-label="Next camera">NEXT</button>
        <button class="exo-btn" type="button" id="cam-share">SHARE</button>
      </div>
      <div class="exo-sheet cam-sheet" id="cam-sheet" data-open="false">
        <button class="exo-sheet-scrim" type="button" aria-label="Close camera list" tabindex="-1"></button>
        <div class="exo-sheet-panel" role="dialog" aria-labelledby="cam-sheet-title">
          <div class="exo-sheet-head">
            <h2 class="exo-sheet-title" id="cam-sheet-title">Cameras in view</h2>
            <button class="exo-btn exo-btn-ghost exo-sheet-close" type="button" data-exo-sheet-close>CLOSE</button>
          </div>
          <div class="exo-sheet-body">
            <ul class="cam-list" id="cam-list"></ul>
            <p class="cam-list-note" id="cam-list-note"></p>
          </div>
        </div>
      </div>
    </aside>
    <div id="map" role="region" aria-label="Camera map"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("cam-list");
    const listNote = document.getElementById("cam-list-note");
    const LIST_MAX = 150;
    const map = L.map("map", { zoomControl: false, worldCopyJump: true, maxZoom: 16 }).setView([39.5, -98.3], 4);
    L.control.zoom({ position: "topright" }).addTo(map);
    // CARTO basemaps now return "API key required" tiles. Esri's dark canvas is keyless
    // with attribution, but past zoom 16 it answers with a blank light-gray tile (HTTP 200).
    const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
    L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Esri, HERE, Garmin, &copy; OpenStreetMap contributors",
      maxNativeZoom: 16, maxZoom: 16
    }).addTo(map);
    L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 16 }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    let timer = 0;
    let seq = 0;
    let features = [];
    let markers = [];
    let cursor = -1;
    let openedHash = false;
    let baseCount = "LOADING";
    let flashUntil = 0;

    function setCount(t) {
      baseCount = t;
      if (Date.now() >= flashUntil) countEl.textContent = t;
    }

    function flash(t) {
      countEl.textContent = t;
      flashUntil = Date.now() + 2500;
      setTimeout(function () { if (Date.now() >= flashUntil) countEl.textContent = baseCount; }, 2600);
    }

    var toastUntil = 0;
    function toast(t) {
      flash(t);
      var el = document.getElementById("cam-toast");
      if (!el) return;
      el.textContent = t;
      el.hidden = false;
      toastUntil = Date.now() + 2500;
      setTimeout(function () { if (Date.now() >= toastUntil) el.hidden = true; }, 2600);
    }

    /* Keep an open camera clear of the thumb bar and the map credits: measure them. */
    function popPad() {
      const phone = matchMedia("(max-width: 719px) and (min-height: 501px)").matches;
      if (!phone) return { tl: [24, 24], br: [24, 24] };
      const m = document.getElementById("map").getBoundingClientRect();
      let low = m.bottom - 150;
      for (const sel of [".leaflet-control-attribution", ".cam-actions"]) {
        const el = document.querySelector(sel);
        if (el && el.offsetParent !== null) low = Math.min(low, el.getBoundingClientRect().top);
      }
      return { tl: [12, 12], br: [12, Math.max(24, Math.round(m.bottom - low + 10))] };
    }

    function setState(state, title, text) {
      document.body.dataset.camState = state;
      if (title) document.getElementById("cam-empty-title").textContent = title;
      if (text) document.getElementById("cam-empty-text").textContent = text;
    }

    function safeHttp(url) {
      try {
        const u = new URL(url);
        if (u.protocol === "https:" || u.protocol === "http:") return u.href;
      } catch (err) {}
      return "";
    }

    /* ---------- playback ----------
       image: a public HTTPS still (Digitraffic, HK Transport Dept) refreshed on its own cadence.
       cams:  plays through cams.exopace.net with the visitor's cams sign-in. exopace.net and
              cams.exopace.net are the same site, so the cams session cookie rides along on a
              credentialed request; signed out, cams answers 401 and we say how to sign in. */
    const CAMS = "https://cams.exopace.net";
    let player = null;

    function stopPlayer() {
      if (!player) return;
      clearTimeout(player.timer);
      if (player.hangTimer) clearTimeout(player.hangTimer);
      if (player.objectUrl) { try { URL.revokeObjectURL(player.objectUrl); } catch (err) {} player.objectUrl = ""; }
      if (player.hls) { try { player.hls.destroy(); } catch (err) {} }
      if (player.video) { try { player.video.pause(); player.video.removeAttribute("src"); player.video.load(); } catch (err) {} }
      player.dead = true;
      player = null;
    }

    function say(box, state, title, text, extra) {
      box.dataset.state = state;
      const msg = box.querySelector(".cam-msg");
      msg.innerHTML = "<b>" + esc(title) + "</b>" + (text ? "<span>" + esc(text) + "</span>" : "") + (extra || "");
    }

    const PLAY_WAIT_MS = 8000;
    function notAnswering(box, detail) {
      say(box, "error", "NOT ANSWERING", detail || "This camera did not start in time.", '<button type="button" class="exo-btn cam-retry-one">RETRY</button>');
    }

    function stillLoop(box, me, src, every) {
      let img = box.querySelector("img");
      if (!img) {
        img = document.createElement("img");
        img.alt = "";
        img.decoding = "async";
        box.insertBefore(img, box.firstChild);
      }
      const tick = async function () {
        if (me.dead) return;
        let href = String(src || "");
        try {
          const url = new URL(href, location.href);
          url.searchParams.set("t", String(Date.now()));
          href = url.href;
        } catch (err) {
          notAnswering(box, "This camera has no picture to show.");
          return;
        }
        if (me.hangTimer) clearTimeout(me.hangTimer);
        me.hangTimer = setTimeout(function () { if (!me.dead) notAnswering(box, "This camera did not return a picture in time."); }, PLAY_WAIT_MS);
        const shown = function () {
          if (me.dead) return;
          if (me.hangTimer) clearTimeout(me.hangTimer);
          box.dataset.state = "playing";
          box.querySelector(".cam-live").textContent = "STILL · EVERY " + (every >= 60 ? Math.round(every / 60) + " MIN" : every + " S");
          me.timer = setTimeout(tick, Math.max(10, every) * 1000);
        };
        const failPic = function () {
          if (me.dead) return;
          if (me.hangTimer) clearTimeout(me.hangTimer);
          notAnswering(box, "The camera's publisher did not return a picture in time.");
        };
        const camsHost = href.indexOf(CAMS + "/") === 0;
        if (!camsHost) {
          img.onload = shown;
          img.onerror = failPic;
          img.src = href;
          return;
        }
        try {
          const ctl = new AbortController();
          const stop = setTimeout(function () { ctl.abort(); }, PLAY_WAIT_MS);
          const res = await fetch(href, { credentials: "include", cache: "no-store", signal: ctl.signal });
          clearTimeout(stop);
          if (me.dead) return;
          const type = (res.headers.get("content-type") || "").toLowerCase();
          if (!res.ok || (type && type.indexOf("image/") !== 0 && type.indexOf("octet-stream") < 0)) {
            failPic();
            return;
          }
          const blob = await res.blob();
          if (me.dead) return;
          if (me.objectUrl) { try { URL.revokeObjectURL(me.objectUrl); } catch (err) {} }
          me.objectUrl = URL.createObjectURL(blob);
          img.onload = shown;
          img.onerror = failPic;
          img.src = me.objectUrl;
        } catch (err) {
          if (me.dead) return;
          failPic();
        }
      };
      tick();
    }

    function loadHlsLib() {
      if (window.Hls) return Promise.resolve(window.Hls);
      return new Promise(function (resolve, reject) {
        const s = document.createElement("script");
        s.src = "/cameras/vendor/hls.light.min.js";
        s.onload = function () { resolve(window.Hls); };
        s.onerror = function () { reject(new Error("hls.js did not load")); };
        document.head.appendChild(s);
      });
    }

    function looksLikeSignIn(status, text) {
      if (status !== 401 && status !== 403) return false;
      return /sign in/i.test(String(text || ""));
    }

    async function sessionLooksSignedIn() {
      try {
        const res = await fetch(CAMS + "/api/me", { credentials: "include", cache: "no-store" });
        if (res.ok) return true;
        const text = await res.text();
        if (looksLikeSignIn(res.status, text)) return false;
        return false;
      } catch (err) {
        return null;
      }
    }

    function clearPlayMedia(box, me) {
      if (me.hangTimer) { clearTimeout(me.hangTimer); me.hangTimer = 0; }
      if (me.hls) { try { me.hls.destroy(); } catch (err) {} me.hls = null; }
      if (me.video) { try { me.video.pause(); me.video.removeAttribute("src"); me.video.load(); } catch (err) {} me.video = null; }
      if (me.objectUrl) { try { URL.revokeObjectURL(me.objectUrl); } catch (err) {} me.objectUrl = ""; }
      for (const old of box.querySelectorAll("img, video")) old.remove();
    }

    function playCamsSignIn(box, me, props) {
      box.__retryPlay = function () { if (!me.dead) playCams(box, me, props); };
      say(box, "signin", "SIGN IN TO PLAY", "This camera plays through EXOpace Cams, which needs a Google sign-in. After you sign in, return to this tab if it stays open.", '<a class="exo-btn cam-signin" href="' + CAMS + "/account?next=" + encodeURIComponent(location.href) + '">SIGN IN</a>');
    }

    async function playHls(box, me, src, opts) {
      const fallback = !!(opts && opts.fallback);
      const video = document.createElement("video");
      video.muted = true; video.playsInline = true; video.autoplay = true; video.controls = true;
      video.setAttribute("playsinline", "");
      box.insertBefore(video, box.firstChild);
      me.video = video;
      return new Promise(function (resolve) {
        let settled = false;
        const done = function (ok, why) {
          if (settled) return;
          settled = true;
          if (me.hangTimer) { clearTimeout(me.hangTimer); me.hangTimer = 0; }
          if (!ok && !fallback && !me.dead) say(box, "error", "NOT ANSWERING", why, '<button type="button" class="exo-btn cam-retry-one">RETRY</button>');
          resolve({ ok: ok, why: why || "" });
        };
        video.addEventListener("playing", function () {
          if (me.dead) return done(false, "");
          if (me.hangTimer) { clearTimeout(me.hangTimer); me.hangTimer = 0; }
          box.dataset.state = "playing";
          box.querySelector(".cam-live").textContent = "LIVE";
          done(true, "");
        });
        if (me.hangTimer) clearTimeout(me.hangTimer);
        me.hangTimer = setTimeout(function () {
          if (!me.dead && box.dataset.state === "loading") done(false, "This camera is not answering. Try again.");
        }, PLAY_WAIT_MS);
        const start = async function () {
          const Hls = window.MediaSource || window.ManagedMediaSource ? await loadHlsLib().catch(function () { return null; }) : null;
          if (me.dead) return done(false, "");
          if (Hls && Hls.isSupported()) {
            const hls = new Hls({ xhrSetup: function (xhr) { xhr.withCredentials = true; }, lowLatencyMode: false, maxBufferLength: 10, manifestLoadingTimeOut: PLAY_WAIT_MS, manifestLoadingMaxRetry: 1, levelLoadingTimeOut: PLAY_WAIT_MS });
            me.hls = hls;
            hls.on(Hls.Events.ERROR, function (_e, data) { if (data && data.fatal) done(false, "The publisher's stream answered with an error (" + (data.response && data.response.code ? "HTTP " + data.response.code : data.details) + ")."); });
            hls.loadSource(src);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });
          } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = src;
            video.addEventListener("error", function () { done(false, "The stream did not load."); });
            video.play().catch(function () {});
          } else done(false, "This browser cannot play HLS video.");
        };
        start();
      });
    }

    async function stillOnce(box, me, src) {
      try {
        const url = new URL(src, location.href);
        url.searchParams.set("t", String(Date.now()));
        const ctl = new AbortController();
        const stop = setTimeout(function () { ctl.abort(); }, PLAY_WAIT_MS);
        const res = await fetch(url.href, { credentials: "include", cache: "no-store", signal: ctl.signal });
        clearTimeout(stop);
        if (me.dead) return { ok: false, why: "" };
        const type = (res.headers.get("content-type") || "").toLowerCase();
        const text = type.indexOf("json") >= 0 || type.indexOf("text/") === 0 ? await res.clone().text().catch(function () { return ""; }) : "";
        if (looksLikeSignIn(res.status, text) && (await sessionLooksSignedIn()) !== true) return { ok: false, signIn: true, why: text };
        if (!res.ok || (type && type.indexOf("image/") !== 0 && type.indexOf("octet-stream") < 0)) {
          return { ok: false, why: text || ("The camera did not return a picture (HTTP " + res.status + ").") };
        }
        const blob = await res.blob();
        if (me.dead) return { ok: false, why: "" };
        let img = box.querySelector("img");
        if (!img) { img = document.createElement("img"); img.alt = ""; img.decoding = "async"; box.insertBefore(img, box.firstChild); }
        if (me.objectUrl) { try { URL.revokeObjectURL(me.objectUrl); } catch (err) {} }
        me.objectUrl = URL.createObjectURL(blob);
        img.src = me.objectUrl;
        box.dataset.state = "playing";
        return { ok: true, why: "" };
      } catch (err) {
        return { ok: false, why: "The camera's publisher did not return a picture in time." };
      }
    }

    async function playCams(box, me, props) {
      const api = props.play.api;
      let res, raw = "";
      try {
        const ctl = new AbortController();
        const stop = setTimeout(function () { ctl.abort(); }, 12000);
        res = await fetch(api + "/media", { credentials: "include", cache: "no-store", signal: ctl.signal });
        clearTimeout(stop);
        raw = await res.text();
      } catch (err) {
        if (me.dead) return;
        say(box, "error", "CAMS DID NOT ANSWER", location.hostname.endsWith("exopace.net") ? "cams.exopace.net is unreachable right now." : "Cams pictures play on exopace.net only; this preview host cannot use the cams sign-in.");
        return;
      }
      if (me.dead) return;
      let body = null;
      try { body = JSON.parse(raw); } catch (err) {}
      if (looksLikeSignIn(res.status, raw) && (await sessionLooksSignedIn()) !== true) {
        playCamsSignIn(box, me, props);
        return;
      }
      if (res.status === 404 || (body && body.error === "camera not found")) {
        say(box, "error", "CAMERA GONE", "EXOpace Cams no longer lists this camera.");
        return;
      }
      const path = body && typeof body === "object"
        ? [body.play_path, body.url, body.href, body.src, body.path].find(function (x) { return typeof x === "string" && x; }) || ""
        : "";
      let src = "";
      if (/^https:\/\/cams\.exopace\.net\//i.test(path)) src = path;
      else if (path.indexOf("/api/cameras/") === 0) src = CAMS + path;
      const paths = [];
      if (src) paths.push(src);
      if (paths.every(function (p) { return !/\/hls(\?|$)/i.test(p) && !/\.m3u8(\?|$)/i.test(p); })) paths.push(api + "/hls");
      if (paths.every(function (p) { return !/\/snapshot(\?|$)/i.test(p); })) paths.push(api + "/snapshot");
      let lastWhy = "This camera has no picture to show.";
      for (let i = 0; i < paths.length; i++) {
        if (me.dead) return;
        const next = paths[i];
        const kind = String((body && (body.type || body.kind || body.format || body.media || body.feed)) || "");
        const hls = /\/hls(\?|$)/i.test(next) || /\.m3u8(\?|$)/i.test(next)
          || (i === 0 && /hls|mpegurl|stream|live/i.test(kind) && !/image|jpeg|jpg|png|still/i.test(kind) && !/\/snapshot(\?|$)/i.test(next));
        const more = i < paths.length - 1;
        if (hls) {
          const result = await playHls(box, me, next, { fallback: more });
          if (me.dead) return;
          if (result.ok) return;
          lastWhy = result.why || lastWhy;
          clearPlayMedia(box, me);
          say(box, "loading", "LOADING", "");
          continue;
        }
        const still = await stillOnce(box, me, next);
        if (me.dead) return;
        if (still.signIn && !more) { playCamsSignIn(box, me, props); return; }
        if (still.ok) {
          stillLoop(box, me, next, Number(props.refresh_s) || 60);
          return;
        }
        lastWhy = still.why || lastWhy;
        clearPlayMedia(box, me);
        say(box, "loading", "LOADING", "");
      }
      say(box, "error", "NOT ANSWERING", lastWhy, '<button type="button" class="exo-btn cam-retry-one">RETRY</button>');
    }


    function startPlayer(marker, root) {
      stopPlayer();
      const box = root && root.querySelector(".cam-player");
      const props = marker && marker.camProps;
      if (!box || !props) return;
      for (const old of box.querySelectorAll("img, video")) old.remove();
      const me = { dead: false, timer: 0, hls: null, video: null, marker: marker };
      player = me;
      say(box, "loading", "LOADING", "");
      const play = props.play || {};
      if (play.type === "image" && safeHttp(play.url).startsWith("https://")) stillLoop(box, me, play.url, Number(props.refresh_s) || 60);
      else if (play.type === "cams" && String(play.api || "").startsWith(CAMS + "/api/cameras/")) playCams(box, me, props);
      else say(box, "error", "NO PICTURE", "This camera has no playable source.");
    }

    function camHash() {
      const match = (location.hash || "").match(/cam=([^&]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function camAt() {
      const match = (location.hash || "").match(/at=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (!match) return null;
      const lat = Number(match[1]), lon = Number(match[2]);
      return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? [lat, lon] : null;
    }

    /* The camera list is read by area, so a shared link carries where the camera is. */
    function camFragment(marker) {
      const ll = marker.getLatLng();
      return "cam=" + encodeURIComponent(marker.camId) + "&at=" + ll.lat.toFixed(5) + "," + ll.lng.toFixed(5);
    }

    function shareUrl(marker) {
      const url = new URL(location.href);
      url.hash = camFragment(marker);
      return url.href;
    }

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function markCurrent() {
      for (const b of listEl.querySelectorAll("button")) b.setAttribute("aria-current", String(Number(b.dataset.i) === cursor));
    }

    function drawList() {
      listEl.textContent = "";
      const n = Math.min(markers.length, LIST_MAX);
      for (let i = 0; i < n; i++) {
        const m = markers[i];
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.i = String(i);
        b.innerHTML = esc(m.camName) + (m.camSource ? "<small>" + esc(m.camSource) + "</small>" : "");
        li.appendChild(b);
        listEl.appendChild(li);
      }
      listNote.textContent = markers.length > LIST_MAX ? (markers.length - LIST_MAX) + " more on the map. Zoom in to narrow the list." : (markers.length ? "" : "No cameras in this view.");
      markCurrent();
    }

    let drawnKey = "", drawnCount = "";
    function draw() {
      // Autopan and small drags re-read the same cameras; keep the open player instead of rebuilding it.
      const qNow = (document.getElementById("cam-q").value || "").trim().toLowerCase();
      const key = qNow + "|" + features.map((f) => (f && f.properties && f.properties.id) || "").join(",");
      if (key === drawnKey && markers.length) { setCount(drawnCount); return; }
      drawnKey = key;
      const prev = markers[cursor] || markers.find((m) => m.isPopupOpen && m.isPopupOpen());
      const keepId = prev ? prev.camId : "";
      const keepOpen = !!(prev && prev.isPopupOpen && prev.isPopupOpen());
      const q = (document.getElementById("cam-q").value || "").trim().toLowerCase();
      const shown = features.filter((f) => {
        const props = (f && f.properties) || {};
        if (!q) return true;
        return ((props.name || "") + " " + (props.source || "")).toLowerCase().includes(q);
      });
      // The open camera survives a re-read of the area, so its picture keeps playing.
      const keep = keepOpen ? prev : null;
      if (!keep) stopPlayer();
      layer.eachLayer(function (l) { if (l !== keep) layer.removeLayer(l); });
      markers = [];
      cursor = -1;
      const pad = popPad();
      for (let i = 0; i < shown.length; i++) {
        const f = shown[i];
        const coords = f && f.geometry && f.geometry.coordinates;
        if (!coords) continue;
        const props = f.properties || {};
        const id = props.id ? String(props.id) : "";
        const name = props.name ? String(props.name) : "Camera";
        if (keep && id === keepId) { markers.push(keep); continue; }
        const marker = L.circleMarker([coords[1], coords[0]], {
          radius: 6, color: "#7ee0ff", weight: 1.5, fillColor: "#ffb84d", fillOpacity: 0.95
        });
        marker.camId = id;
        marker.camName = name;
        marker.camSource = props.source ? String(props.source) : "";
        marker.camProps = props;
        let html = "<strong>" + esc(name) + "</strong>";
        const line = [props.source, props.place].filter(Boolean).map(String).join(" · ");
        if (line) html += '<div class="cam-src">' + esc(line) + "</div>";
        const play = props.play || {};
        const credit = play.type === "image" && play.credit ? '<span class="cam-credit">© ' + esc(play.credit) + "</span>" : "";
        html += '<div class="cam-player" data-state="loading"><div class="cam-msg" role="status"><b>LOADING</b></div><span class="cam-live">LIVE</span>' + credit + "</div>";

        let acts = "";
        if (play.type === "cams") {
          let camsHref = CAMS + "/map";
          const q = [];
          if (id) q.push("camera=" + encodeURIComponent(id));
          if (coords && Number.isFinite(Number(coords[1])) && Number.isFinite(Number(coords[0]))) {
            q.push("lat=" + Number(coords[1]).toFixed(5));
            q.push("lon=" + Number(coords[0]).toFixed(5));
          }
          // Cams currently reads camera/lat/lon only; z is for a closer fly if/when it honors it.
          q.push("z=13");
          q.push("zoom=13");
          if (q.length) camsHref += "?" + q.join("&");
          acts += '<a class="exo-btn" href="' + esc(camsHref) + '" target="_blank" rel="noopener">OPEN IN CAMS</a>';
        }
        if (id) acts += '<button type="button" class="exo-btn cam-copy" data-id="' + esc(id) + '">COPY LINK</button>';
        if (acts) html += '<div class="cam-pop-actions">' + acts + "</div>";
        marker.bindPopup(html, { autoPanPaddingTopLeft: pad.tl, autoPanPaddingBottomRight: pad.br, maxWidth: 280 });
        marker.on("click", function () { openedHash = true; cursor = markers.indexOf(marker); markCurrent(); publishCam(marker); });
        marker.addTo(layer);
        markers.push(marker);
      }
      if (keep && markers.indexOf(keep) < 0) markers.push(keep);
      const clipped = features.length >= 800;
      drawnCount = shown.length + (q ? " / " + features.length : "") + " IN VIEW" + (clipped ? " · ZOOM FOR MORE" : "");
      setCount(drawnCount);
      const searchAllBtn = document.getElementById("cam-search-all");
      if (searchAllBtn) searchAllBtn.hidden = !(q && !shown.length && features.length);
      if (!features.length) setState("empty", "NO CAMERAS IN VIEW", "The camera feed has no cameras here. Pan or zoom out to look somewhere else.");
      else if (!shown.length) setState("empty", "NO MATCHES", "No camera in this view matches “" + q + "”. Zoom in, or search all.");
      else setState("ready");
      if (keepId) {
        const again = markers.find((m) => m.camId === keepId);
        if (again) {
          cursor = markers.indexOf(again);
          if (keepOpen && again !== keep) again.openPopup();
        }
      }
      drawList();
      const want = camHash();
      if (want && !openedHash) {
        const hit = markers.find((m) => m.camId === want);
        if (hit && hit.isPopupOpen()) openedHash = true;
        else if (hit) {
          openedHash = true;
          cursor = markers.indexOf(hit);
          map.setView(hit.getLatLng(), Math.max(map.getZoom(), 12));
          hit.openPopup();
          publishCam(hit);
          markCurrent();
        }
      }
    }

    /* Leaflet with worldCopyJump can report longitudes like 270 (same as -90).
       Wrap them so the catalogue is queried for the place on screen, not an inverted box. */
    function mapBbox() {
      const b = map.getBounds();
      let w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
      const span = e - w;
      const wrap = function (lon) { while (lon > 180) lon -= 360; while (lon < -180) lon += 360; return lon; };
      w = wrap(w); e = wrap(e);
      if (span >= 359) { w = -180; e = 180; }
      else if (w > e) { w = -180; e = 180; }
      const padX = Math.max(Math.abs(e - w) * 0.02, 0.002);
      const padY = Math.max((n - s) * 0.02, 0.002);
      return [w - padX, Math.max(-90, s - padY), e + padX, Math.min(90, n + padY)].map((n) => n.toFixed(4)).join(",");
    }

    async function load() {
      const bbox = mapBbox();
      const mine = ++seq;
      setCount("LOADING");
      try {
        const res = await fetch("/api/cameras.geojson?bbox=" + encodeURIComponent(bbox) + "&max=800");
        if (!res.ok) throw new Error(String(res.status));  // 502 = the cams catalogue is unreachable
        const data = await res.json();
        if (mine !== seq) return;
        features = Array.isArray(data.features) ? data.features : [];
        if (mine !== seq) return;
        draw();
      } catch (err) {
        if (mine !== seq) return;
        features = [];
        markers = [];
        drawnKey = "";
        stopPlayer();
        cursor = -1;
        layer.clearLayers();
        drawList();
        setCount("FEED OFFLINE");
        setState("error", "CAMERA FEED UNREACHABLE", "The camera list did not answer. Nothing is shown rather than a guess.");
      }
    }

    function focusMarker(i) {
      const marker = markers[i];
      if (!marker) return;
      cursor = i;
      openedHash = true;  // the hash now records this pick; never reopen it over the playing popup
      if (marker.camId) history.replaceState(null, "", "#" + camFragment(marker));
      map.setView(marker.getLatLng(), Math.max(map.getZoom(), 11));
      marker.openPopup();
      publishCam(marker);
      markCurrent();
    }

    function cycle(step) {
      if (!markers.length) { flash("NO CAMERAS"); return; }
      focusMarker((cursor + step + markers.length) % markers.length);
    }

    function publishCam(marker) {
      if (!marker || !window.EXO || !EXO.bus) return;
      const ll = marker.getLatLng();
      EXO.bus.set({
        kind: "camera",
        id: marker.camId || "",
        label: marker.camName || "CAMERA",
        lat: ll.lat,
        lon: ll.lng,
      });
    }

    async function copyLink() {
      const marker = markers[cursor] || markers.find((m) => m.isPopupOpen && m.isPopupOpen());
      const id = marker && marker.camId;
      if (!id) { toast("PICK A CAMERA"); return; }
      const text = shareUrl(marker);
      try {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) { await navigator.share({ title: marker.camName, url: text }); toast("SHARED"); return; }
      } catch (err) { if (err && err.name === "AbortError") return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
        else throw new Error("no clipboard");
        toast("LINK COPIED");
      } catch (err) {
        toast("COPY FAILED");
      }
    }

    /* Keep the whole popup clear of the attribution and the thumb bar; Leaflet's own autopan
       runs before the popup settles and while the map is still moving. */
    function fitPopup(popup) {
      const el = popup && popup.getElement && popup.getElement();
      if (!el || !map.hasLayer(popup)) return;
      const m = map.getContainer().getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const pad = popPad();
      const top = m.top + pad.tl[1], left = m.left + pad.tl[0];
      const bottom = m.bottom - pad.br[1], right = m.right - pad.br[0];
      let dx = 0, dy = 0;
      if (r.bottom > bottom) dy = r.bottom - bottom;
      if (r.top - dy < top) dy = r.top - top;
      if (r.right > right) dx = r.right - right;
      if (r.left - dx < left) dx = r.left - left;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) map.panBy([Math.round(dx), Math.round(dy)]);
    }
    map.on("popupopen", function (e) { setTimeout(function () { fitPopup(e.popup); }, 350); });

    map.on("moveend", function () {
      clearTimeout(timer);
      timer = setTimeout(load, 250);
    });
    document.getElementById("locate").addEventListener("click", function () {
      if (!navigator.geolocation) { flash("NO LOCATION"); return; }
      flash("LOCATING");
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 10);
      }, function () { flash("LOCATION DENIED"); }, { timeout: 10000 });
    });
    document.getElementById("cam-q").addEventListener("input", function () { flashUntil = 0; draw(); });
    document.getElementById("cam-q").addEventListener("keydown", function (event) {
      if (event.key !== "Enter") return;
      const q = (document.getElementById("cam-q").value || "").trim();
      if (!q) return;
      const searchAllBtn = document.getElementById("cam-search-all");
      if (searchAllBtn && !searchAllBtn.hidden) { event.preventDefault(); searchCatalogue(q); }
    });
    document.getElementById("cam-prev").addEventListener("click", function () { cycle(-1); });
    document.getElementById("cam-next").addEventListener("click", function () { cycle(1); });
    document.getElementById("cam-share").addEventListener("click", copyLink);
    function retrySigninPlayers() {
      document.querySelectorAll(".cam-player[data-state='signin']").forEach(function (el) {
        if (typeof el.__retryPlay === "function") el.__retryPlay();
      });
    }
    window.addEventListener("focus", retrySigninPlayers);
    window.addEventListener("pageshow", retrySigninPlayers);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") retrySigninPlayers();
    });
    document.getElementById("cam-retry").addEventListener("click", load);
    document.getElementById("cam-search-all").addEventListener("click", function () {
      const q = (document.getElementById("cam-q").value || "").trim();
      if (q) searchCatalogue(q);
    });

    async function searchCatalogue(q) {
      setCount("SEARCHING");
      try {
        const res = await fetch("/api/cameras.geojson?q=" + encodeURIComponent(q) + "&max=50");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        const hits = Array.isArray(data.features) ? data.features : [];
        if (!hits.length) {
          const searchAllBtn = document.getElementById("cam-search-all");
          if (searchAllBtn) searchAllBtn.hidden = true;
          setState("empty", "NO MATCHES", "No camera in the catalogue matches “" + q + "”.");
          setCount("0 MATCHES");
          return;
        }
        const pts = [];
        for (let i = 0; i < hits.length; i++) {
          const c = hits[i] && hits[i].geometry && hits[i].geometry.coordinates;
          if (c && Number.isFinite(Number(c[1])) && Number.isFinite(Number(c[0]))) pts.push([Number(c[1]), Number(c[0])]);
        }
        if (!pts.length) { setState("empty", "NO MATCHES", "No camera in the catalogue matches “" + q + "”."); return; }
        map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 13, animate: true });
      } catch (err) {
        setCount("FEED OFFLINE");
        setState("error", "CAMERA FEED UNREACHABLE", "The camera list did not answer. Nothing is shown rather than a guess.");
      }
    }

    function coordsFromRecord(data) {
      if (!data || typeof data !== "object") return null;
      const c = data.camera || data.properties || data;
      const geo = (data.geometry && data.geometry.coordinates) || (c.geometry && c.geometry.coordinates) || c.coordinates;
      const lat = Number(c.lat != null ? c.lat : (geo && geo[1]));
      const lon = Number(c.lon != null ? c.lon : c.lng != null ? c.lng : (geo && geo[0]));
      return Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? [lat, lon] : null;
    }

    async function lookupCamCoords(id) {
      try {
        const res = await fetch("/api/cameras.geojson?id=" + encodeURIComponent(id) + "&max=5");
        if (res.ok) {
          const data = await res.json();
          const feats = Array.isArray(data.features) ? data.features : [];
          const hit = feats.find((f) => f && f.properties && f.properties.id === id) || feats[0];
          const at = hit && coordsFromRecord(hit);
          if (at) return at;
        }
      } catch (err) {}
      try {
        const res = await fetch(CAMS + "/api/cameras/" + encodeURIComponent(id), { credentials: "include" });
        if (res.ok) {
          const at = coordsFromRecord(await res.json());
          if (at) return at;
        }
      } catch (err) {}
      return null;
    }
    listEl.addEventListener("click", function (event) {
      const b = event.target.closest("button[data-i]");
      if (!b) return;
      if (window.EXO_LAYOUT && matchMedia("(max-width: 719px) and (min-height: 501px)").matches) EXO_LAYOUT.closeSheet(document.getElementById("cam-sheet"));
      focusMarker(Number(b.dataset.i));
    });
    map.on("popupclose", function (event) {
      if (player && player.marker && player.marker.getPopup && player.marker.getPopup() === event.popup) stopPlayer();
    });
    map.on("popupopen", function (event) {
      const root = event.popup.getElement();
      const owner = markers.find((m) => m.getPopup && m.getPopup() === event.popup);
      if (owner) startPlayer(owner, root);
      if (root && !root.dataset.retryBound) {
        root.dataset.retryBound = "1";
        root.addEventListener("click", function (e) {
          if (e.target.closest(".cam-retry-one")) { const m = markers.find((x) => x.getPopup && x.getPopup() === event.popup); if (m) startPlayer(m, root); }
        });
      }
      const btn = root && root.querySelector(".cam-copy");
      if (!btn) return;
      btn.addEventListener("click", function () {
        const id = btn.getAttribute("data-id");
        const hit = markers.find((m) => m.camId === id);
        if (hit) cursor = markers.indexOf(hit);
        copyLink();
      });
    });
    addEventListener("resize", function () { map.invalidateSize(); });
    document.addEventListener("keydown", function (event) {
      if (document.documentElement.dataset.exoCmd === "open") return;
      const target = event.target;
      if (target && target.closest && target.closest("input, textarea, select")) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.key === "]" || event.key === "n") { event.preventDefault(); cycle(1); }
      else if (event.key === "[" || event.key === "p") { event.preventDefault(); cycle(-1); }
    });
    (async function startFromHash() {
      const id = camHash();
      let at = camAt();
      if (id && !at) {
        at = await lookupCamCoords(id);
        if (at) {
          const next = "cam=" + encodeURIComponent(id) + "&at=" + at[0].toFixed(5) + "," + at[1].toFixed(5);
          if ((location.hash || "").replace(/^#/, "") !== next) history.replaceState(null, "", "#" + next);
        }
      }
      if (at) map.setView(at, 13);
      load();
    })();
  </script>
  <script src="/maps/mgrs.js"></script>
  <script src="/assets/exo-bus.js"></script>
  <script src="/assets/exo-state.js"></script>
  <script src="/assets/exo-cmd.js?v=1"></script>
</body>
