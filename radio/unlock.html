<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXOpace Radio — unlock</title>
<link rel="stylesheet" href="/assets/exo-modern.css?v=4">
<style>
body{margin:0;background:var(--exo-void);color:var(--exo-text);font-family:var(--exo-sans);
 display:flex;align-items:center;justify-content:center;min-height:100vh;
 padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.w{max-width:420px;width:100%;background:rgba(3,6,11,.78);border:1px solid var(--exo-line);
 border-radius:16px;padding:22px 18px}
h1{font-family:var(--exo-mono);font-size:19px;letter-spacing:.08em;color:var(--exo-amber);margin:0 0 8px}
p{color:var(--exo-muted);font-size:14px;line-height:1.5}
input{background:#0d141d;border:1px solid var(--exo-line);color:var(--exo-text);padding:13px;border-radius:12px;
 font:16px var(--exo-mono);width:100%;margin:12px 0;box-sizing:border-box;min-height:44px}
button{background:transparent;border:1px solid var(--exo-cyan);color:var(--exo-cyan);padding:13px;border-radius:12px;
 font:15px var(--exo-sans);width:100%;min-height:44px}
code{background:#111823;padding:2px 6px;border-radius:5px;font-size:13px;color:var(--exo-cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--exo-amber);outline-offset:2px}
</style></head><body><div class="w">
<h1>EXOpace Radio</h1>
<p>This device isn't unlocked yet. Paste the access token to save it here permanently,
or open the full link that includes <code>?t=...</code></p>
<input id="t" placeholder="access token" autocapitalize="off" autocorrect="off" spellcheck="false">
<button onclick="go()">Unlock</button>
</div><script>
function go(){const v=document.getElementById('t').value.trim();
 if(v)location.href='./?t='+encodeURIComponent(v);}
document.getElementById('t').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body></html>
