<h1>dj SDR</h1>
<p>This device isn't unlocked yet. Paste the access token to save it here permanently,

<input id="t" placeholder="access token" autocapitalize="off" autocorrect="off" spellcheck="false">
<button onclick="go()">Unlock</button>

function go(){const v=document.getElementById('t').value.trim();
 if(v)location.href='./?t='+encodeURIComponent(v);}
