name: Site monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v1
      - name: Check live EXOpace and Cams
        run: node scripts/monitor-exopace.mjs
        env:
          CHROME_PATH: google-chrome
