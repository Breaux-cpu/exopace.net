<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070D" />
  <title>SYSTEM · EXOpace</title>
  <link rel="stylesheet" href="/assets/exo-modern.css?v=8" />
  <style>
    body { margin: 0; background: #04070D; color: #F0F6FC; }
    main { padding: 16px; max-width: 720px; }
    h1 { margin: 8px 0 12px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; letter-spacing: 0.16em; color: #FFB84D; font-weight: 500; }
    .sys-row { display: flex; justify-content: space-between; gap: 12px; min-height: 44px; align-items: center; border-bottom: 1px solid rgba(126, 224, 255, 0.25); font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 13px; }
    .sys-k { color: #FFB84D; }
    a { color: #7EE0FF; }
  </style>
</head>
<body>
<header class="exo-bar">
  <a class="exo-skip" href="#exo-main">Skip to content</a>
  <a class="exo-brand" href="/mission/">EXOPACE</a>
  <nav class="exo-sites" aria-label="EXOpace surfaces">
    <a href="https://cams.exopace.net/map">LIVE MAP</a>
    <a href="/radio/">COMMS &amp; RF</a>
    <a href="/sentinel/">SENTINEL</a>
    <a href="/system/" aria-current="page">SYSTEM</a>
  </nav>
</header>
<div class="exo-pill" id="exo-pill" aria-live="polite">
  <span id="exo-pill-clock">UTC — · JD —</span>
  <span id="exo-pill-fix">NO FIX</span>
  <span id="exo-pill-target">NO TARGET</span>
  <button type="button" id="exo-pill-copy">COPY</button>
  <a id="exo-pill-jump" href="https://cams.exopace.net/map">JUMP</a>
</div>
<main id="exo-main">
  <h1>SYSTEM</h1>
  <p class="sys-row"><span class="sys-k">BLE</span><span id="sys-ble">STANDBY</span></p>
  <p class="sys-row"><span class="sys-k">TILE CACHE</span><span id="sys-cache">STANDBY</span></p>
  <p class="sys-row"><span class="sys-k">EDGE</span><span id="sys-health">STANDBY</span></p>
  <p class="sys-row"><span class="sys-k">TARGET</span><span id="sys-target">NO TARGET</span></p>
  <p class="sys-row"><span class="sys-k">SIGN IN</span><a href="https://cams.exopace.net/account">Sign in with Google</a></p>
</main>
<script src="/maps/mgrs.js"></script>
<script src="/assets/exo-bus.js"></script>
<script src="/assets/exo-state.js"></script>
<script>
(function () {
  var ble = document.getElementById("sys-ble");
  var cache = document.getElementById("sys-cache");
  var health = document.getElementById("sys-health");
  var target = document.getElementById("sys-target");
  ble.textContent = "STANDBY · this browser cannot pair EXOpace hardware";
  if (!("caches" in window)) cache.textContent = "OFFLINE";
  else caches.keys().then(function (keys) {
    cache.textContent = keys.length ? keys.length + " CACHE" : "EMPTY";
  }).catch(function () { cache.textContent = "OFFLINE"; });
  fetch("https://cams.exopace.net/api/health").then(function (res) { return res.json(); }).then(function (body) {
    health.textContent = body && body.ok && body.mongo ? "ONLINE · MONGO" : "DEGRADED";
  }).catch(function () { health.textContent = "OFFLINE"; });
  function paint(row) {
    if (!row || !row.label) { target.textContent = "NO TARGET"; return; }
    target.textContent = row.label + (row.norad ? " · " + row.norad : "");
  }
  paint(window.EXO && window.EXO.bus && window.EXO.bus.get());
  window.addEventListener("exo-target", function (event) { paint(event.detail); });
})();
</script>
</body>
</html>
